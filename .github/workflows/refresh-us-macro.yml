name: Refresh US market data

# 美股页的两块数据都来自公开接口，不需要 key：
#   宏观（CPI / 核心 CPI / 非农 / 失业率）→ BLS
#   行情（指数 / 板块 ETF / 个股）        → 东方财富延迟行情
# 第 136 轮之前这两块都靠服务端手工跑，2026-08-11 之后就停了 —— 页面首屏的「当前状态」
# 因此变成三个月前数据的结论（第 135–137 轮：先自曝、再修宏观、最后修行情）。
on:
  schedule:
    # 美股收盘 16:00 ET = 20:00/21:00 UTC；22:20 UTC 抓当天收盘价足够稳
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-us-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh quotes (Eastmoney delayed)
        run: node scripts/fetch-us-quotes.mjs
        continue-on-error: true

      - name: Refresh macro block (BLS)
        run: node scripts/fetch-us-macro.mjs
        continue-on-error: true

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- src/data/us-market-latest.json; then
            echo "数据没有变化，不提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 第 186 轮：抓了一半（stale / 缺指数 / 宏观缺失）的快照不许提交 ——
          # 它会让 `tests/market-snapshot-verify.test.ts` 红，进而卡住整条部署链。
          # 合格才提交；不合格就丢弃这次结果，保留仓库里原来那份（旧但完整）。
          if ! node scripts/verify-us-market-snapshot.mjs; then
            echo "::warning::这次抓取的快照不完整，已丢弃（保留仓库里原来那份）" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::美股快照抓取不完整，本次不提交"
            git checkout -- src/data/us-market-latest.json
            exit 0
          fi
          node -e "const d=require('./src/data/us-market-latest.json');console.log('行情',d.market.succeeded+'/'+d.market.requested,'SPX',d.market.indices[0]?.price,'CPI',d.macro.cpi.reference,d.macro.cpi.actual+'%','非农',d.macro.payroll.reference,d.macro.payroll.actual+'k')" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "zoro-bot"
          git config user.email "bot@zorotreeking.online"
          git add src/data/us-market-latest.json
          git commit -m "chore(us-market): refresh quotes and macro from public APIs"
          git push
