name: Refresh US macro

# 宏观块（CPI / 核心 CPI / 非农 / 失业率）来自 BLS 公开 API，不需要 key。
# 第 136 轮之前这半边靠服务端手工跑，2026-08-11 之后就停了 —— 页面首屏的
# 「当前状态」因此变成了三个月前数据的结论（第 135 轮只能在首屏自曝陈旧）。
on:
  schedule:
    # BLS 通常 08:30 ET 发布，22:20 UTC 抓当天数据足够稳
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-us-macro
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh macro block from BLS
        run: node scripts/fetch-us-macro.mjs

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- src/data/us-market-latest.json; then
            echo "宏观数据没有变化，不提交" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e "const d=require('./src/data/us-market-latest.json');console.log('CPI',d.macro.cpi.reference,d.macro.cpi.actual+'%','非农',d.macro.payroll.reference,d.macro.payroll.actual+'k')" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "zoro-bot"
          git config user.email "bot@zorotreeking.online"
          git add src/data/us-market-latest.json
          git commit -m "chore(macro): refresh US macro block from BLS"
          git push
