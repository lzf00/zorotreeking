name: Lighthouse Mobile

# 移动端跑分：每周一次 + 手动触发。
#
# 为什么单独一条流水线而不是塞进 deploy 门禁：
#   桌面 preset 已经是每次部署必过的门禁，移动端 8 URL × 3 次再来 24 次跑分
#   会把每次部署的 CI 时间翻倍。折中成周检 —— 移动端独有的问题（触摸目标
#   太小、字体缩放、折叠布局）本来就是缓慢漂移的，一周一测够用。
#
# 2026-11-10 上线第一天就抓到真问题：页脚 4 个链接高度只有 16px，
# WCAG 2.2「目标尺寸（最小）」要 24×24，桌面端永远测不出来。

on:
  # 第 182 轮：和 a11y 一样，「每周一 10:00」在这个仓库实测会延迟甚至整周不触发 ——
  # 这条 workflow 连续两次失败、且没有任何成功记录（第 179 轮自动化体检发现）。
  # 可靠触发源换成部署后醒一次 + 戳记判到期；cron 留在原地当备份。
  schedule:
    - cron: "0 2 * * 1"   # UTC 02:00 = BJT 10:00 周一
  workflow_run:
    workflows: ["Build & Deploy"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write   # 记戳记要提交
  statuses: write

concurrency:
  group: lighthouse-mobile
  cancel-in-progress: false

jobs:
  lhci-mobile:
    runs-on: ubuntu-latest
    # 10 个 URL × 3 次 = 30 次移动端跑分（移动端比桌面慢）
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Decide whether this run is due
        id: due
        run: |
          set +e
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          # 上游部署失败时线上还是旧版本，没必要跑分
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "⏭️ 上游部署没有成功，跳过本次移动端跑分"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/audit-due.mjs --stamp=src/data/lighthouse-mobile.json --max-age-days=7 $FORCE

      - name: Run Lighthouse CI (mobile preset)
        id: lhci
        if: steps.due.outputs.due == 'true'
        env:
          LHCI_UPLOAD__GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes @lhci/cli@0.13.x autorun --config=.lighthouserc.mobile.json

      # 断言失败的原因只存在于需要登录才能读的日志里（第 181 轮在 a11y 上踩过），
      # 这里把「哪条规则、哪一页、期望 vs 实测」写成注解，公开页面就能看见。
      - name: Explain assertion failures as annotations
        if: always() && steps.due.outputs.due == 'true'
        run: node scripts/lhci-annotate.mjs --file=.lighthouseci/assertion-results.json

      - name: Record the audit stamp
        if: always() && steps.lhci.outcome != 'skipped' && steps.due.outputs.due == 'true'
        run: |
          node scripts/record-audit-stamp.mjs \
            --stamp=src/data/lighthouse-mobile.json \
            --violations="$(node -e 'const r=require("./.lighthouseci/assertion-results.json");console.log(r.filter((x)=>x.passed===false).length)' 2>/dev/null || echo '')"

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30
