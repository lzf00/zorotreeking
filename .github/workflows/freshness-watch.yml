name: Content freshness watch

# 每早看一眼内容流水线有没有真的产出（第 94 轮）。
#
# 为什么不能只靠 deploy.yml 里那一步：`content/freshness` 状态是**部署时**写的，
# 而部署只在有人 push 或定时部署（工作日 15:30）时才跑。如果内容流水线自己坏了
# （2026-11-19 那次 startup_failure 就是这样）而且当天没有别的人 push，
# 就没有任何东西会红 —— 这正是那三天「站点全绿、日报却停了」的结构性缺口。
#
# 这条 workflow 不依赖任何人的提交：每天 08:30 BJT（日报 08:00 开跑之后）自己跑一次，
#  · 有板块停更时打开一条 GitHub Issue（恢复后自动关闭）；
#  · job 同时直接红 → GitHub 会给仓库管理员发失败邮件。
#
# 停更判定用的是仓库里的阈值（check-freshness.mjs），与部署时完全一致，不另立标准。

on:
  schedule:
    - cron: "23 20 * * *"   # UTC 20:00 = BJT 04:00，日报窗口（UTC 18:17 起，约 70 分钟）之后
  # 主通道：日报一跑完就查（不管是成功还是失败）。定时触发只是个兜底 —— 实测
  # 这个仓库的 schedule 普遍延迟 5–7 小时（见 docs/architecture.md 第 96 轮），
  # 只靠 cron 根本卡不准「日报到底出了没有」。
  workflow_run:
    workflows: ["Daily digest"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 只读 src/content 与脚本，不装依赖（这两个脚本没有第三方 import）
      - name: Sync freshness issue
        # 第 178 轮：这一步只是"报告"。让它红的话，后面「到底有没有停更」的判定会被
        # 直接跳过（GitHub 在一步失败后默认不再跑后续步骤），报警器坏掉反而吞掉警报。
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-freshness-issue.mjs

      # 第 213 轮：上面那步只看「仓库里有没有今天的稿子」。2026-11-24/25 的两次停更里，
      # 稿子其实**都在**仓库里，是部署被单元测试拦下 —— 所有看门狗因此全绿，线上两天没更新。
      # 「写了」和「发了」是两件事，这里补后者。
      - name: Fail the run when the site is older than the content
        if: always()
        run: |
          set +e
          node scripts/check-deploy-freshness.mjs | tee /tmp/deploy-freshness.log
          code=${PIPESTATUS[0]}
          {
            echo '### 部署新鲜度（内容是进了仓库，还是也上线了）'
            echo ''
            echo '```'
            cat /tmp/deploy-freshness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::内容进了仓库但没上线 —— 部署流水线可能被拦住了（看 daily-digest 的 deploy job）"
          fi
          exit "$code"

      - name: Fail the run when a stream is stale
        if: always()
        run: |
          set +e
          node scripts/check-freshness.mjs > /tmp/freshness.log 2>&1
          code=$?
          cat /tmp/freshness.log
          {
            echo '### 内容新鲜度'
            echo ''
            echo '```'
            cat /tmp/freshness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::有内容流水线停更 —— commit status 已写成 failure，本条 job 也红（会发失败邮件）"
          fi
          exit "$code"
