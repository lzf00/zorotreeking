name: Lighthouse CI

# Deploy 完成后等待 1 分钟再跑 Lighthouse，对比性能预算。
#
# 触发方式：
#   1. deploy.yml 的 workflow_run —— 只在改了模板 / 样式 / 脚本 / 配置时真跑，
#      纯内容提交（src/content 下的日报、快照）跳过。自动化任务每十几分钟就提一次，
#      而一轮审计要 35–40 分钟；不跳过的话 concurrency 会不停取消前一轮，
#      性能预算实际上永远跑不完。
#   2. 每日定时 —— 内容改动也可能影响大列表页（标签页、归档页），所以每天固定跑一次
#      完整的 15 URL 审计兜底。
#   3. workflow_dispatch —— 手动跑，永远真跑。

on:
  workflow_run:
    workflows: ["Build & Deploy"]
    types: [completed]
  schedule:
    # 北京时间 03:00，站点流量最低、runner 也最闲
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

# 不取消前一轮：取消发生在 workflow 级别，早于 scope 判断——只要还开着
# cancel-in-progress，纯内容提交的部署也会把正在跑的审计掐掉，性能预算就又跑不完了。
# 改成排队：被判为"只动内容"的运行在第一步（约 15 秒）就跳过并退出，队列很快排空；
# 真正的审计则能安稳跑完。
concurrency:
  group: lighthouse-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  lhci:
    # 手动 / 定时永远跑；workflow_run 只在 deploy 成功时跑
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # 15 个 URL × 5 次 = 75 次跑分（覆盖首页/栏目/标签/归档/文章/相册/个股/带地图的徒步页），
    # 实测约 35–40 分钟，留足余量避免排队抖动把任务掐掉
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # 要拿部署提交和它的父提交算 diff，浅克隆至少留 3 层，避免合并提交取不到父对象
          fetch-depth: 3

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Decide whether audited pages changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --first-parent + -m：合并提交也能拿到相对于第一父提交的改动清单
          changed_paths=$(git diff-tree -r -m --first-parent --no-commit-id --name-only "$DEPLOYED_SHA" | sort -u)
          decision=$(printf '%s\n' "$changed_paths" | node scripts/lighthouse-scope.mjs)
          if [ "$decision" = "skip" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Content-only deployment (no template/style/script change); Lighthouse skipped — the daily scheduled run still covers it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # 等生产真的切到目标提交再开跑：部署的 rsync + 原子切换要几分钟，早于它开跑会
      # 量到「新旧版本混着」的页面（同一个页面两轮分数差 7–14 分，有几次就是这么来的）。
      - name: Wait until production serves the deployed commit
        if: steps.scope.outputs.run == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            live=$(curl -fsS --max-time 10 https://www.zorotreeking.online/deploy-meta.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha||"")}catch{console.log("")}})')
            if [ "$live" = "$DEPLOYED_SHA" ]; then
              echo "production is on $DEPLOYED_SHA (attempt $attempt)"
              echo "production-sha=$live" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting: production=$live target=$DEPLOYED_SHA (attempt $attempt)"
            sleep 15
          done
          echo "::warning::production never reported $DEPLOYED_SHA within 10 minutes; auditing the live site anyway"

      - name: Run Lighthouse CI
        if: steps.scope.outputs.run == 'true'
        env:
          LHCI_UPLOAD__GITHUB_TOKEN: ${{ github.token }}
        # assert 失败的话 exit code 非 0；assert 设了 warn 不会 fail，error 才 fail
        run: npx --yes @lhci/cli@0.13.x autorun

      # 把逐 URL 中位分数打出来：日志被截断时尾部这段仍然在，同时写进 step summary，
      # 省得为了"这轮到底多少分"去翻产物或猜。
      - name: Summarize scores
        if: always() && steps.scope.outputs.run == 'true'
        run: node scripts/lighthouse-summary.mjs --summary-out lighthouse-summary.md

      - name: Confirm production did not change mid-audit
        if: always() && steps.scope.outputs.run == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          live=$(curl -fsS --max-time 10 https://www.zorotreeking.online/deploy-meta.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha||"")}catch{console.log("")}})')
          echo "audited=$DEPLOYED_SHA live-after=$live"
          if [ "$live" != "$DEPLOYED_SHA" ]; then
            echo "::warning::production changed during the audit ($DEPLOYED_SHA → $live); per-URL scores may mix two builds"
            echo "⚠️ 审计期间生产切换过版本（$DEPLOYED_SHA → $live），分数可能混版本" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports as artifact
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            lighthouse-summary.md
          include-hidden-files: true
          retention-days: 14
