name: Lighthouse CI

# Deploy 完成后等待 1 分钟再跑 Lighthouse，对比性能预算。
#
# 触发方式：
#   1. deploy.yml 的 workflow_run —— 只在改了模板 / 样式 / 脚本 / 配置时真跑，
#      纯内容提交（src/content 下的日报、快照）跳过。自动化任务每十几分钟就提一次，
#      而一轮审计要 35–40 分钟；不跳过的话 concurrency 会不停取消前一轮，
#      性能预算实际上永远跑不完。
#   2. 每日定时 —— 内容改动也可能影响大列表页（标签页、归档页），所以每天固定跑一次
#      完整的 15 URL 审计兜底。
#   3. workflow_dispatch —— 手动跑，永远真跑。

on:
  workflow_run:
    workflows: ["Build & Deploy"]
    types: [completed]
  schedule:
    # 北京时间 03:00，站点流量最低、runner 也最闲
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

# 不取消前一轮：取消发生在 workflow 级别，早于 scope 判断——只要还开着
# cancel-in-progress，纯内容提交的部署也会把正在跑的审计掐掉，性能预算就又跑不完了。
# 改成排队：被判为"只动内容"的运行在第一步（约 15 秒）就跳过并退出，队列很快排空；
# 真正的审计则能安稳跑完。
concurrency:
  group: lighthouse-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  lhci:
    # 手动 / 定时永远跑；workflow_run 只在 deploy 成功时跑
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # 15 个 URL × 5 次 = 75 次跑分（覆盖首页/栏目/标签/归档/文章/相册/个股/带地图的徒步页），
    # 实测约 35–40 分钟，留足余量避免排队抖动把任务掐掉
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # 要拿部署提交和它的父提交算 diff，浅克隆至少留 3 层，避免合并提交取不到父对象
          fetch-depth: 3

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Decide whether audited pages changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --first-parent + -m：合并提交也能拿到相对于第一父提交的改动清单
          changed_paths=$(git diff-tree -r -m --first-parent --no-commit-id --name-only "$DEPLOYED_SHA" | sort -u)
          decision=$(printf '%s\n' "$changed_paths" | node scripts/lighthouse-scope.mjs)
          if [ "$decision" = "skip" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Content-only deployment (no template/style/script change); Lighthouse skipped — the daily scheduled run still covers it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # 等生产切到「一个稳定版本」再开跑：部署的 rsync + 原子切换要几分钟，早于它开跑会
      # 量到新旧版本混着的页面（同一个页面两轮差 7–14 分，有几次就是这么来的）。
      #
      # 注意「目标提交」不一定等得到：自动化提交十几分钟一次，排队中的审计常被更新的部署
      # 顶过去，那时生产永远不会回到 DEPLOYED_SHA（上一版就是死等 10 分钟才开跑）。
      # 所以判断标准改成「生产有一个稳定版本」：连续两次读到同一个 sha 就开跑，并记下
      # 实际被审的是哪个 sha——审计测的是线上真实服务，只要它是完整的一版就有效。
      - name: Wait for production to settle
        id: prodwait
        if: steps.scope.outputs.run == 'true'
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          read_sha() {
            curl -fsS --max-time 10 https://www.zorotreeking.online/deploy-meta.json 2>/dev/null |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha||"")}catch{console.log("")}})'
          }
          prev=""
          for attempt in $(seq 1 30); do
            live=$(read_sha)
            if [ -n "$live" ] && [ "$live" = "$prev" ]; then
              echo "production settled on $live (target was $DEPLOYED_SHA, attempt $attempt)"
              echo "audited-sha=$live" >> "$GITHUB_OUTPUT"
              echo "$live" > audited-sha.txt
              if [ "$live" != "$DEPLOYED_SHA" ]; then
                echo "::warning::target $DEPLOYED_SHA was superseded by $live before this run started; auditing $live instead"
                echo "ℹ️ 目标提交 \`$DEPLOYED_SHA\` 已被 \`$live\` 顶替，本轮审的是后者" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            echo "waiting: live=$live (prev=$prev, attempt $attempt)"
            prev="$live"
            sleep 20
          done
          echo "::warning::production never settled within 10 minutes; auditing the live site anyway"
          echo "unknown" > audited-sha.txt

      # 行情接口冷启动要 3.5 秒（热态 40ms），而它会和首屏资源抢带宽，直接影响 LCP 读数。
      # 审计前先烘一遍，让 15 个 URL 比的是页面本身，不是缓存状态。
      # 把「本轮到底审了哪一版」发成一条 commit status：公开可读，不用 token 翻日志。
      # 之前正是因为这个信息只存在于日志里，才没能第一时间发现分数被挂到了别的提交上。
      - name: Publish which build was audited
        if: steps.scope.outputs.run == 'true'
        run: |
          # 归一化：只取 sha。历史上这里曾写成 `audited-sha=<sha>`（把 GITHUB_OUTPUT 的格式
          # 抄进了文件），导致后面拿整串当提交号去发 status，404 后静默失败。
          audited=$(sed 's/^audited-sha=//' audited-sha.txt 2>/dev/null || echo unknown)
          target="$audited"
          if [ "$target" = "unknown" ] || [ -z "$target" ]; then
            target="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi
          body="{\"context\":\"perf/audited\",\"state\":\"success\",\"description\":\"audited ${target:0:7} (run ${{ github.run_id }})\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          code=$(curl -sS -o /tmp/status-post.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${target}" \
            -d "$body") || code=000
          echo "POST /statuses/${target} → HTTP ${code}"
          cat /tmp/status-post.json 2>/dev/null || true
          # 发不出去不算失败（审计本身有效），但必须留痕：之前 || true 把 404 吞了，
          # 「审的是哪一版」这条信息悄悄没了整整一轮。
          if [ "${code}" != "201" ]; then
            echo "::warning::perf/audited 状态没发出去（HTTP ${code}，target=${target}）"
          fi

      - name: Warm the market endpoints
        if: steps.scope.outputs.run == 'true'
        run: |
          for endpoint in indices funds sentiment; do
            first=$(curl -s -o /dev/null -w '%{time_total}' --max-time 30 "https://www.zorotreeking.online/api/market/${endpoint}" || echo "timeout")
            warm=$(curl -s -o /dev/null -w '%{time_total}' --max-time 30 "https://www.zorotreeking.online/api/market/${endpoint}" || echo "timeout")
            echo "${endpoint}: 冷 ${first}s → 热 ${warm}s"
          done

      - name: Run Lighthouse CI
        if: steps.scope.outputs.run == 'true'
        env:
          LHCI_UPLOAD__GITHUB_TOKEN: ${{ github.token }}
          # 不显式指定的话，LHCI 用 GITHUB_SHA 当提交号——而 workflow_run 事件里 GITHUB_SHA
          # 是「创建这一轮时默认分支的头」，排队久一点就和实际被审的那一版错位（实测把
          # 一轮审计挂到了上一个提交上，查分数时找错 commit）。这里钉死成真正被审的 sha。
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ steps.prodwait.outputs['audited-sha'] || github.event.workflow_run.head_sha || github.sha }}
        # assert 失败的话 exit code 非 0；assert 设了 warn 不会 fail，error 才 fail
        run: npx --yes @lhci/cli@0.13.x autorun

      # 把逐 URL 中位分数打出来：日志被截断时尾部这段仍然在，同时写进 step summary，
      # 省得为了"这轮到底多少分"去翻产物或猜。
      - name: Summarize scores
        if: always() && steps.scope.outputs.run == 'true'
        run: node scripts/lighthouse-summary.mjs --summary-out lighthouse-summary.md

      # 再把分数发成 commit status（一条 URL 一个 context）。
      # 这样不用 token、不用翻 artifact，`GET /commits/<sha>/statuses` 就能读到逐页分数——
      # 之前拿不到产物时只能靠猜「这轮到底掉没掉分」。
      - name: Publish per-URL scores as commit statuses
        if: always() && steps.scope.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 和上面 perf/audited 用同一个目标 sha：真正被审的那一版
          TARGET_SHA: ${{ steps.prodwait.outputs['audited-sha'] || github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/lighthouse-statuses.mjs --post

      - name: Confirm production did not change mid-audit
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          # 归一化：只取 sha。历史上这里曾写成 `audited-sha=<sha>`（把 GITHUB_OUTPUT 的格式
          # 抄进了文件），导致后面拿整串当提交号去发 status，404 后静默失败。
          audited=$(sed 's/^audited-sha=//' audited-sha.txt 2>/dev/null || echo unknown)
          live=$(curl -fsS --max-time 10 https://www.zorotreeking.online/deploy-meta.json 2>/dev/null |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).sha||"")}catch{console.log("")}})')
          echo "audited=$audited live-after=$live"
          if [ "$live" != "$audited" ]; then
            echo "::warning::production changed during the audit ($audited → $live); per-URL scores may mix two builds"
            echo "⚠️ 审计期间生产切换过版本（$audited → $live），分数可能混版本" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports as artifact
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            lighthouse-summary.md
          include-hidden-files: true
          retention-days: 14
