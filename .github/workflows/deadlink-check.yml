name: Dead link check

# 每周一 09:00 北京时间扫全站外链，死链推飞书群。
#
# 手动 dispatch 可以传 concurrency 调并发（默认 8）；
# 也可以传 delink=dry-run / apply，把报告里的死链一键摘成纯文本
# （apply 会自动 commit + push 内容改动，只有手动触发才可能发生）。
#
# 需要 GitHub Secret（可选）：
#   FEISHU_DEADLINK_WEBHOOK  飞书群 bot webhook URL
#     未配置时脚本本地打印结果 + 上传 artifact，不推飞书

on:
  schedule:
    - cron: "0 1 * * 1"   # UTC 01:00 = BJT 09:00 周一
  workflow_dispatch:
    inputs:
      concurrency:
        description: "并发数（1-16）"
        type: string
        default: "8"
      delink:
        description: "死链处理：off 只报告 / dry-run 看会改什么 / apply 摘链并提交"
        type: choice
        options: ["off", "dry-run", "apply"]
        default: "off"

permissions:
  contents: write   # delink=apply 时要提交内容改动；定时任务永远只报告

concurrency:
  group: deadlink-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 5200 条外链、单域名并发 2、每条最多 2×12s 重试：2026-11-11 那次跑了 32 分钟，
    # 离 40 分钟的旧上限只剩 8 分钟。跨境链路一抖就会超时误报，放到 60 分钟。
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci

      - name: Run dead link check
        env:
          FEISHU_DEADLINK_WEBHOOK: ${{ secrets.FEISHU_DEADLINK_WEBHOOK }}
        continue-on-error: true      # 有死链时脚本 exit 1，我们不希望 workflow 标 failure
        run: |
          CONC="${{ github.event.inputs.concurrency }}"
          if [ -z "$CONC" ]; then CONC="8"; fi
          npx tsx scripts/check-deadlinks.ts --concurrency=$CONC

      # 一键摘链：默认 off（定时任务永远只报告）。dry-run 只打印，
      # apply 才会落盘并进下一步提交。脚本本身幂等、只碰 src/content/**.mdx。
      - name: De-link dead sources
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.delink != 'off' }}
        run: |
          if [ "${{ inputs.delink }}" = "dry-run" ]; then
            npx tsx scripts/deadlink-delink.ts --dry-run
          else
            npx tsx scripts/deadlink-delink.ts
          fi

      - name: Commit de-linked content
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.delink == 'apply' }}
        run: |
          if git diff --quiet -- src/content; then
            echo "没有需要提交的改动（内容已经是干净的）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          git commit -m "content: de-link dead sources reported by the weekly sweep"
          git push

      # 没有这一步的时候，跑出 66 个死链的周报也是「success」，
      # 只有点进 artifact 才知道有死链 —— 等于没人看。这里把结论顶到
      # run 页面的 Summary，并在有死链时打 warning 注解。
      - name: Summarize into the run page
        if: always()
        run: |
          REPO_ROOT="$(pwd)"
          node - "$REPO_ROOT" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.argv[2];
          const dir = path.join(root, "reports");
          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter((f) => /^deadlinks-.*\.json$/.test(f)).sort()
            : [];
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const write = (line) => summary ? fs.appendFileSync(summary, line + "\n") : console.log(line);
          if (!files.length) {
            write("## 死链巡查：没找到报告文件");
            write("");
            write("`scripts/check-deadlinks.ts` 没有产出 `reports/deadlinks-*.json`，看上面的步骤日志。");
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path.join(dir, files[files.length - 1]), "utf8"));
          const dead = report.deadList || [];
          write(`## 死链巡查：${report.dead} 个死链 / ${report.total} 条外链`);
          write("");
          write(`| 分类 | 数量 |`);
          write(`| --- | --- |`);
          write(`| 健康 | ${report.ok} |`);
          write(`| 容忍（限流 / WAF） | ${report.tolerated} |`);
          write(`| **死链** | **${report.dead}** |`);
          if (dead.length) {
            write("");
            write("### 前 15 个死链");
            write("");
            write("| 状态 | URL | 出现于 |");
            write("| --- | --- | --- |");
            for (const d of dead.slice(0, 15)) {
              write(`| ${d.status} | ${d.url} | ${d.fromFile} |`);
            }
            if (dead.length > 15) write("");
            if (dead.length > 15) write(`…… 其余 ${dead.length - 15} 个见 artifact。`);
            const byHost = {};
            for (const d of dead) {
              const host = new URL(d.url).host;
              byHost[host] = (byHost[host] || 0) + 1;
            }
            const worst = Object.entries(byHost).sort((a, b) => b[1] - a[1])[0];
            console.log(`::warning title=发现 ${dead.length} 个死链::${worst[0]} 占 ${worst[1]} 个，详情见 job summary`);
          } else {
            write("");
            write("全部通过 ✅");
          }
          NODE

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadlink-report
          path: reports/deadlinks-*.json
          retention-days: 30
