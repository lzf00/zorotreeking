name: Daily digest

# 每天 UTC 18:17 = 北京 02:17：拉外部源 → 豆包摘要 → commit + push 回 main
#
# 为什么不是 00:00 UTC：这个仓库的 schedule 触发被 GitHub 排队，实测稳定延迟 5–7 小时
# （daily-digest 连续 5 次落在 05:00–06:00 UTC，deadlink/a11y/lighthouse-mobile 也各延迟
# 6–7 小时）。00:00 UTC 是全球 cron 最高峰的整点，排在队伍最前面的是海量仓库。
# 换成 18:17 UTC（错开整点、避开高峰）后，即使再延迟 5–6 小时也仍在早上 08:00 前后落地；
# 不延迟则北京凌晨就已生成，读者早上一开就有。
# GitHub 安全规则：用 GITHUB_TOKEN 推的 commit 不触发 push event，所以
# 我们这里跑完 fetch-and-commit 后显式调 deploy.yml（workflow_call）。

on:
  schedule:
    # 两个备份时刻（第 106 轮）：本仓库的 schedule 实测延迟 5–7.5 小时，而且**已经发生过
    # 一次整天不触发**（11-21 就没跑，内容直接缺了三天）。第二条 cron 是保险：
    # 第一条跑成了，第二条会因为 `digest-fetch.ts` 的幂等早退直接退出，不抓源、不调 LLM。
    - cron: "17 18 * * *"   # 北京 02:17
    - cron: "47 21 * * *"   # 北京 05:47（备用）
  workflow_dispatch:
    inputs:
      mode:
        description: "ai | invest | both"
        type: choice
        options: [both, ai, invest]
        default: both
      translate_limit:
        description: "本次翻译最多处理多少篇（默认 25，防 60min 超时）"
        type: string
        default: "25"
      skip_fetch:
        description: "跳过 digest fetch，只跑 翻译/embedding（节省额度）"
        type: boolean
        default: false
        # 历史回填 + 大批量翻译 请走 bulk-backfill.yml workflow（流式 commit 不丢数据）

permissions:
  contents: write
  # 调用的 deploy.yml 声明了 statuses: write（失败步骤诊断要写 commit status）。
  # 被调用工作流的权限不能高于调用方，否则整条 workflow 在启动阶段就失败
  # （症状是 conclusion=startup_failure、没有任何 step 日志 —— 这就是 2026-11-19
  #  起 AI 日报静默停更三天、而 workflow 文件本身完全没问题的原因）。
  statuses: write
  # 被调用的 deploy.yml 的 catch-up-digest 任务要 dispatch 部署（actions: write）。
  # 被调用方声明的权限大于调用方 → 运行在启动阶段就失败（startup_failure，无任何日志）。
  actions: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    # 全量回填翻译 60 篇 ≈ 30-50 分钟（每篇 LLM call 30-60s）；预留 90 min
    # daily 流程瘦身：fetch ~17min + translate ≤40min + embedding ~3min ≈ 60min。
    # 大批量回填走 bulk-backfill.yml，独立 6h job
    timeout-minutes: 70
    outputs:
      committed: ${{ steps.commit.outputs.committed == 'true' || steps.commit_followups.outputs.committed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # 预检（第 78 轮）：把「模型调不通」归类成人话再往下走。
      # 静默停更 3 天的教训是：一次失败如果只说「这步红了」，下次修的时候还得重新猜。
      - name: LLM preflight (does the summarizer answer?)
        if: github.event.inputs.skip_fetch != 'true'
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          npx tsx scripts/digest-preflight.ts | tee /tmp/llm-preflight.log
          {
            echo '### LLM 预检'
            echo ''
            echo '```'
            cat /tmp/llm-preflight.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run digest fetcher
        if: github.event.inputs.skip_fetch != 'true'
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'both' }}"
          npx tsx scripts/digest-fetch.ts "$MODE"

      # 先 commit digest（embedding 慢/失败也不影响 digest 落地）。
      # embedding 在下一个 step 跑，跑成功后再单独 commit。
      - name: Commit digest mdx first
        id: commit
        run: |
          git config user.name "zorotreeking-bot"
          git config user.email "bot@zorotreeking.online"
          git add src/content/ai/digest-*.mdx src/content/invest/digest-*.mdx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new digest files. Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE_CN=$(date -u -d "+8 hours" +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)
          git commit -m "chore(digest): daily auto digest $DATE_CN"
          PUSHED=0
          for i in 1 2 3; do
            git fetch origin main
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
            if git push origin HEAD:main; then
              PUSHED=1
              echo "✓ pushed on attempt $i"
              break
            fi
            echo "  push failed (attempt $i), backoff $((i*3))s + retry..."
            sleep $((i * 3))
          done
          if [ "$PUSHED" != "1" ]; then
            echo "❌ push failed after 3 attempts"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # 新 zh 文章翻译成 en（仅日常增量；大批量回填/重译走 bulk-backfill.yml）
      # cron / dispatch 都是增量，每次最多 translate_limit 篇（默认 25 防 timeout）
      - name: Translate posts zh → en (incremental)
        timeout-minutes: 40
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        continue-on-error: true
        run: |
          LIMIT="${{ github.event.inputs.translate_limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="25"; fi
          npx tsx scripts/translate-digest.ts --limit=$LIMIT

      # embedding 增量更新（独立 step，失败不影响 digest commit；
      # 即使超时被 cancel，新 digest mdx 已经在 main 上了）
      # 逐源体检（第 79 轮）：源全挂或摘要全失败时，run 页面要能直接看到「哪个源多少条」。
      - name: Digest source report
        if: always()
        run: |
          for file in reports/digest-sources-*.json; do
            [ -f "$file" ] || continue
            {
              echo "### $(basename "$file")"
              echo ''
              echo '```json'
              cat "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      # 收尾断言（第 78 轮）：日报流水线最危险的失败不是报错，而是**什么都没产出**。
      # 2026-11-19 起 AI 日报静默停更 3 天，站点照常构建、门禁全绿、巡检 0 失败 ——
      # 因为没有「今天到底产出了没」的检查。这条会让停更直接变成红 job。
      - name: Assert today's digest really landed
        if: always() && github.event.inputs.skip_fetch != 'true'
        run: |
          node scripts/check-freshness.mjs --require-today --max-age=1 --ignore-gaps | tee /tmp/freshness.log
          {
            echo '### 内容新鲜度'
            echo ''
            echo '```'
            cat /tmp/freshness.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh post embeddings (incremental)
        timeout-minutes: 15
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          # ARK embedding 多数模型必须走 endpoint 调用，在 console 创建后
          # 把 ep-xxxxxxxx-xxxxx 配到 GitHub repo Variables → DOUBAO_EMBEDDING_MODEL
          DOUBAO_EMBEDDING_MODEL: ${{ vars.DOUBAO_EMBEDDING_MODEL }}
        continue-on-error: true
        run: npx tsx scripts/generate-embeddings.ts

      # 即使 translate 被 cancel/timeout，也要把已翻好的 en + zh.mdx 提交保住
      - name: Commit embeddings.json + en translations if changed
        id: commit_followups
        if: always()
        continue-on-error: true
        run: |
          git add src/data/embeddings.json \
                  src/content/ai/*.en.mdx src/content/invest/*.en.mdx src/content/photo/*.en.mdx src/content/hike/*.en.mdx \
                  src/content/ai/digest-*.zh.mdx src/content/invest/digest-*.zh.mdx \
                  2>/dev/null || true
          if git diff --cached --quiet; then
            echo "embeddings + 翻译都没变化，跳过"
            exit 0
          fi
          DATE_CN=$(date -u -d "+8 hours" +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)
          git commit -m "chore(ai): refresh embeddings + en translations $DATE_CN"
          PUSHED=0
          for i in 1 2 3; do
            git fetch origin main
            git pull --rebase --autostash origin main || { git rebase --abort 2>/dev/null || true; }
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            sleep $((i * 3))
          done
          if [ "$PUSHED" != "1" ]; then
            echo "❌ follow-up push failed after 3 attempts"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # 跑完后显式调 deploy.yml（GITHUB_TOKEN 推的 commit 不会自己触发 push event）
  deploy:
    needs: fetch-and-commit
    if: needs.fetch-and-commit.outputs.committed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
