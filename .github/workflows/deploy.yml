name: Build & Deploy

# 触发：
#  - 任意 push 到 main → 立即 build + 部署
#  - 工作日北京 15:30（A 股收盘后）定时 rebuild
#  - 手动触发（用于调试）
#  - 被其他 workflow 调用（如 daily-digest 跑完调过来；GITHUB_TOKEN 推的 commit 不能触发 push event）
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1-5"   # UTC 07:30 = 北京 15:30
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # 服务器信息走 Secrets，避免在公开仓库 / Actions 日志里直接泄露
  # GitHub repo → Settings → Secrets and variables → Actions 配：
  #   SSH_HOST       服务器 IP 或域名
  #   SSH_USER       部署用户
  #   DEPLOY_PATH    web 根目录绝对路径
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          # 拿全部历史让 /changelog 页能读 git log
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # NOTE: scripts/invest-snapshot.ts 不再在每次 build 跑。
      # 它原本设计是月末归档持仓快照（每月一次），但每次 build 跑会：
      #   1) 当前 _holdings.yaml 全是基金（market: Fund），脚本 filter 只匹配 A/ETF，noop；
      #   2) 万一未来改成真实股票持仓，每次 build 都会把当月真实份额写入静态文件公开。
      # 月末归档改为手动触发：`npx tsx scripts/invest-snapshot.ts 2026-06` 本地跑后 commit。

      # 扫描 public/photos/uploads/<album>/，生成对应 manifest（含尺寸 + EXIF）
      # Decap 上线编辑相册时上传的图会落到这些子目录，构建时自动归档进 manifest
      - name: Build photo manifests
        continue-on-error: true
        run: npx tsx scripts/build-photo-manifests.ts

      - name: Astro type-check
        # type error 提前拦，避免红线 build 上线
        run: npx astro check

      - name: Validate ETF data quality
        # HTTP 200 / JSON 存在不等于业务数据正确；发布前独立重算完整度和因子公式。
        run: npm run validate:etf

      - name: Verify AMap build configuration
        env:
          PUBLIC_AMAP_JS_KEY: ${{ secrets.PUBLIC_AMAP_JS_KEY }}
          PUBLIC_AMAP_SECURITY_CODE: ${{ secrets.PUBLIC_AMAP_SECURITY_CODE }}
        run: |
          # 生产发布必须带高德配置；浏览器运行时异常仍会自动降级到 OSM。
          [ -n "$PUBLIC_AMAP_JS_KEY" ] || { echo "❌ 缺少 PUBLIC_AMAP_JS_KEY"; exit 1; }
          [ -n "$PUBLIC_AMAP_SECURITY_CODE" ] || { echo "❌ 缺少 PUBLIC_AMAP_SECURITY_CODE"; exit 1; }
          echo "✓ 高德地图构建配置已注入"

      - name: Build site
        env:
          # Giscus 评论：值来自 GitHub repo Settings → Variables。
          # 未设置时 Giscus.astro 组件自动跳过，不渲染。
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          # 站长平台验证 meta（BaseLayout 条件渲染，未配置不输出）
          PUBLIC_GOOGLE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_VERIFICATION }}
          PUBLIC_BAIDU_VERIFICATION: ${{ vars.PUBLIC_BAIDU_VERIFICATION }}
          PUBLIC_BING_VERIFICATION: ${{ vars.PUBLIC_BING_VERIFICATION }}
          # 高德 Web JS API：敏感配置只从仓库 Secrets 注入构建产物。
          # 未配置或运行时加载失败时，路线图会自动使用 OpenStreetMap 备用底图。
          PUBLIC_AMAP_JS_KEY: ${{ secrets.PUBLIC_AMAP_JS_KEY }}
          PUBLIC_AMAP_SECURITY_CODE: ${{ secrets.PUBLIC_AMAP_SECURITY_CODE }}
        run: npm run build

      - name: Stamp release identity
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("dist/deploy-meta.json", "w", encoding="utf-8") as handle:
              json.dump({"sha": os.environ["GITHUB_SHA"], "built_at": datetime.now(timezone.utc).isoformat()}, handle)
              handle.write("\n")
          PY

      - name: Verify required secrets
        run: |
          # 前置自检：缺哪个 secret 明确报错
          missing=()
          [ -z "$SSH_HOST" ]    && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ]    && missing+=("SSH_USER")
          [ -z "$DEPLOY_PATH" ] && missing+=("DEPLOY_PATH")
          if [ -n "${missing[*]}" ]; then
            echo "❌ 缺少 GitHub Secret(s): ${missing[*]}"
            exit 1
          fi

          # 只做格式校验，不在公开 Actions 日志输出基础设施指纹或长度。
          if printf "%s" "$SSH_HOST" | grep -qE "^[[:space:]]|[[:space:]]$|^http|/$"; then
            echo "❌ SSH_HOST 看起来异常（含空白 / http 前缀 / 末尾斜杠）"
            exit 1
          fi
          if printf "%s" "$SSH_USER" | grep -qE "^[[:space:]]|[[:space:]]$|/"; then
            echo "❌ SSH_USER 含空白或斜杠"
            exit 1
          fi
          if ! printf "%s" "${DEPLOY_PATH%/}" | grep -qE "^/[A-Za-z0-9._/-]+/dist$"; then
            echo "❌ DEPLOY_PATH 必须是无空格的绝对路径并以 /dist 结尾"
            exit 1
          fi
          echo "✓ 三个 secret 看起来格式 OK"

      - name: Setup SSH key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # SSH_DEPLOY_KEY 是 base64 编码的单行字符串；解码后才是 OpenSSH 私钥
          echo "$SSH_DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1 | grep -v "^#" | head -5
          # 静默验证私钥可解析；不要把私钥的任何片段写入 Actions 日志。
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Reconcile AMap CSP allowlist
        run: |
          # 高德 SDK、运行时数据与 Giscus 样式必须通过 CSP。配置修改前保留备份，
          # nginx 语法检查失败时立即恢复，避免安全头更新影响整个站点。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$GITHUB_SHA" <<'SH'
          set -eu
          sha=$1
          if [ "$(id -u)" -eq 0 ]; then
            as_root=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            as_root="sudo -n"
          else
            echo "❌ 部署账号没有更新 nginx CSP 所需的免密 sudo 权限"
            exit 1
          fi
          echo "[csp] 定位 active nginx 安全头配置"
          # 从 nginx -T 的 active include 图谱取文件，兼容没有 .conf 后缀的 snippet。
          target=$($as_root nginx -T 2>&1 | awk '
            /^# configuration file / { file=$4; sub(/:$/, "", file) }
            /Content-Security-Policy/ && file { print file; exit }
          ')
          if [ -z "$target" ]; then
            echo "❌ /etc/nginx 中没有找到 Content-Security-Policy 配置"
            exit 1
          fi
          backup="/tmp/zorotreeking-csp-$sha.conf"
          echo "[csp] 备份并更新白名单"
          $as_root cp "$target" "$backup"
          if ! $as_root python3 - "$target" <<'PY'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          def allow(directive: str, origins: list[str], text: str, create_after=None) -> str:
              pattern = re.compile(rf"({re.escape(directive)}\s+)([^;]*)(;)")
              match = pattern.search(text)
              if not match:
                  if not create_after:
                      raise SystemExit(f"missing CSP directive: {directive}")
                  anchor = re.compile(rf"({re.escape(create_after)}\s+[^;]*;)").search(text)
                  if not anchor:
                      raise SystemExit(f"missing CSP anchor directive: {create_after}")
                  addition = f" {directive} {' '.join(origins)};"
                  return text[:anchor.end()] + addition + text[anchor.end():]
              values = match.group(2).split()
              for origin in origins:
                  if origin not in values:
                      values.append(origin)
              return text[:match.start()] + match.group(1) + " ".join(values) + match.group(3) + text[match.end():]

          source = allow("script-src", [
              "https://webapi.amap.com",
              "https://restapi.amap.com",
              "https://jsapi-service.amap.com",
              "https://mapplugin.amap.com",
          ], source)
          source = allow("style-src", ["https://giscus.app"], source)
          source = allow("worker-src", ["'self'", "blob:"], source, create_after="script-src")
          source = allow("connect-src", ["https://*.amap.com", "https://*.autonavi.com"], source)
          path.write_text(source, encoding="utf-8")
          PY
          then
            $as_root cp "$backup" "$target"
            exit 1
          fi
          echo "[csp] 校验并重新加载 nginx"
          if ! $as_root nginx -t; then
            $as_root cp "$backup" "$target"
            $as_root nginx -t
            exit 1
          fi
          if ! $as_root systemctl reload nginx; then
            $as_root cp "$backup" "$target"
            $as_root nginx -t
            $as_root systemctl reload nginx
            exit 1
          fi
          echo "✓ 运行时 CSP 白名单已核对"
          SH

          # 从公网响应确认 active nginx 已加载新策略，而不是只改了磁盘文件。
          csp=$(curl -fsSI https://www.zorotreeking.online/hike/ | tr -d '\r' | grep -i '^content-security-policy:')
          printf '%s' "$csp" | grep -q 'https://webapi.amap.com'
          printf '%s' "$csp" | grep -q 'https://restapi.amap.com'
          printf '%s' "$csp" | grep -q 'https://jsapi-service.amap.com'
          printf '%s' "$csp" | grep -q 'https://mapplugin.amap.com'
          printf '%s' "$csp" | grep -q "worker-src 'self' blob:"
          printf '%s' "$csp" | grep -q 'https://\*.amap.com'
          printf '%s' "$csp" | grep -Eq 'style-src [^;]*https://giscus\.app([ ;])'
          echo "✓ 公网 CSP 已允许高德 SDK、运行时请求与 Giscus 样式"

      - name: Prepare versioned release
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" "$GITHUB_SHA" <<'SH'
          set -eu
          release_root=$1
          sha=$2
          target="$release_root/releases/$sha"
          mkdir -p "$target"
          # Seed unchanged files as hard links from the active release. The
          # following checksum rsync then transfers only genuinely changed bytes.
          if [ -L "$release_root/current" ]; then
            current=$(readlink -f "$release_root/current")
            test -d "$current"
            cp -al "$current"/. "$target"/
          fi
          SH

      - name: Rsync dist → versioned release
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          rsync -avz --checksum --delete --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:$release_root/releases/$GITHUB_SHA/"

      - name: Activate release atomically
        id: activate
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" "$GITHUB_SHA" <<'SH'
          set -eu
          release_root=$1
          sha=$2
          new_release="$release_root/releases/$sha"
          test -f "$new_release/deploy-meta.json"
          if [ -L "$release_root/current" ]; then
            old_release=$(readlink -f "$release_root/current")
            ln -sfn "$old_release" "$release_root/previous"
          elif [ -d "$release_root/dist" ]; then
            ln -sfn "$release_root/dist" "$release_root/previous"
          fi
          ln -sfn "$new_release" "$release_root/current.next"
          mv -Tf "$release_root/current.next" "$release_root/current"
          SH

      - name: Production acceptance smoke test
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          last = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen("https://www.zorotreeking.online/deploy-meta.json", timeout=20) as resp:
                      meta = json.load(resp)
                  if meta.get("sha") != os.environ["GITHUB_SHA"]:
                      raise ValueError(f"static release mismatch: {meta.get('sha')}")
                  with urllib.request.urlopen("https://www.zorotreeking.online/hike/", timeout=20) as resp:
                      csp = resp.headers.get("Content-Security-Policy", "")
                  required_amap_origins = (
                      "https://webapi.amap.com",
                      "https://restapi.amap.com",
                      "https://jsapi-service.amap.com",
                      "https://mapplugin.amap.com",
                      "https://*.amap.com",
                      "worker-src 'self' blob:",
                  )
                  if not all(origin in csp for origin in required_amap_origins):
                      raise ValueError("AMap CSP allowlist missing from production response")
                  if not re.search(r"style-src [^;]*https://giscus\.app(?: |;)", csp):
                      raise ValueError("Giscus stylesheet origin missing from style-src")
                  with urllib.request.urlopen("https://www.zorotreeking.online/api/market/etf", timeout=20) as resp:
                      data = json.load(resp)
                  items = data.get("items") or []
                  missing = [x.get("code") for x in items if x.get("ratio_pct") is None]
                  if data.get("ok") is True and len(items) == 12 and not missing and data.get("baseline_date"):
                      print(f"✓ static sha={meta['sha']} · AMap CSP ready · ETF API 12/12 · baseline={data['baseline_date']}")
                      break
                  last = {"count": len(items), "missing": missing, "baseline": data.get("baseline_date")}
              except Exception as exc:
                  last = str(exc)
              if attempt < 5:
                  time.sleep(10)
          else:
              raise SystemExit(f"ETF production smoke failed: {last}")
          PY

      - name: Roll back failed release
        if: failure() && steps.activate.outcome == 'success'
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" <<'SH'
          set -eu
          release_root=$1
          test -L "$release_root/previous"
          previous=$(readlink -f "$release_root/previous")
          test -d "$previous"
          ln -sfn "$previous" "$release_root/current.rollback"
          mv -Tf "$release_root/current.rollback" "$release_root/current"
          echo "Rollback completed"
          SH

      # 通知 IndexNow（Bing/Yandex/Naver/Seznam）新增/改动 URL，加速索引
      # 失败不阻塞 deploy
      - name: Ping IndexNow
        continue-on-error: true
        run: npx tsx scripts/indexnow-ping.ts

      # 百度普通收录主动推送（百度不支持 IndexNow）
      # BAIDU_PUSH_TOKEN 未配置时脚本自动跳过
      - name: Push to Baidu
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: npx tsx scripts/baidu-push.ts

      - name: Summary
        run: |
          # 不打印 SSH_HOST / DEPLOY_PATH，防止公开 Actions 日志泄露
          echo "Deployed ✓"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
