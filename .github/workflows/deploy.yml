name: Build & Deploy

# 触发：
#  - 任意 push 到 main → 立即 build + 部署
#  - 工作日北京 15:30（A 股收盘后）定时 rebuild
#  - 手动触发（用于调试）
#  - 被其他 workflow 调用（如 daily-digest 跑完调过来；GITHUB_TOKEN 推的 commit 不能触发 push event）
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * 1-5"   # UTC 07:30 = 北京 15:30
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

# 默认 token 只有读权限。失败诊断步骤要把「哪一步挂了」写成 commit status
# （公开仓库读 status 不需要登录），必须显式申请 statuses: write。
# contents: write 是给末尾的「补跑停更的日报」用的（第 113 轮）：它要把生成的内容
# commit 回仓库，否则这次部署出去了、下次又被旧内容覆盖回来。
# 注意：被 daily-digest / weekly-roundup / bulk-backfill 调用时，调用方也必须有
# contents: write —— reusable workflow 不能申请比调用方更大的权限（第 107 轮踩过）。
permissions:
  contents: write
  statuses: write

env:
  # 服务器信息走 Secrets，避免在公开仓库 / Actions 日志里直接泄露
  # GitHub repo → Settings → Secrets and variables → Actions 配：
  #   SSH_HOST       服务器 IP 或域名
  #   SSH_USER       部署用户
  #   DEPLOY_PATH    web 根目录绝对路径
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 12 分钟不够：站点把 CSS 内联进每个页面，所以任何影响 CSS 的改动
    # （换 tailwind 插件版本、改 @font-face、动 global.css）都会重写全部 1140 个
    # HTML，rsync 实测要同步 ~215MB。跨境链路 300-500KB/s 时 12 分钟刚好被砍
    # （2026-11-10 run 42832275324 就是这样超时取消的，站点未受影响，但白跑一次）。
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          # 拿全部历史让 /changelog 页能读 git log
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: npm ci

      # 守卫测试一直没进部署流程：2026-11-11 发现 tests/ 里有 3 个断言因为前几轮
      # 重构失效，红着也照样部署了 20 多次。整套只跑 ~1s，放在 build 前面。
      - name: Unit and guard tests
        id: tests
        run: npm test

      # NOTE: scripts/invest-snapshot.ts 不再在每次 build 跑。
      # 它原本设计是月末归档持仓快照（每月一次），但每次 build 跑会：
      #   1) 当前 _holdings.yaml 全是基金（market: Fund），脚本 filter 只匹配 A/ETF，noop；
      #   2) 万一未来改成真实股票持仓，每次 build 都会把当月真实份额写入静态文件公开。
      # 月末归档改为手动触发：`npx tsx scripts/invest-snapshot.ts 2026-06` 本地跑后 commit。

      # 扫描 public/photos/uploads/<album>/，生成对应 manifest（含尺寸 + EXIF）
      # Decap 上线编辑相册时上传的图会落到这些子目录，构建时自动归档进 manifest
      - name: Build photo manifests
        continue-on-error: true
        run: npx tsx scripts/build-photo-manifests.ts

      - name: Astro type-check
        id: typecheck
        # type error 提前拦，避免红线 build 上线
        run: npx astro check

      - name: Validate ETF data quality
        id: etf
        # HTTP 200 / JSON 存在不等于业务数据正确；发布前独立重算完整度和因子公式。
        run: npm run validate:etf

      - name: Verify AMap build configuration
        id: amap
        env:
          PUBLIC_AMAP_JS_KEY: ${{ secrets.PUBLIC_AMAP_JS_KEY }}
          PUBLIC_AMAP_SECURITY_CODE: ${{ secrets.PUBLIC_AMAP_SECURITY_CODE }}
        run: |
          # 生产发布必须带高德配置；浏览器运行时异常仍会自动降级到 OSM。
          [ -n "$PUBLIC_AMAP_JS_KEY" ] || { echo "❌ 缺少 PUBLIC_AMAP_JS_KEY"; exit 1; }
          [ -n "$PUBLIC_AMAP_SECURITY_CODE" ] || { echo "❌ 缺少 PUBLIC_AMAP_SECURITY_CODE"; exit 1; }
          echo "✓ 高德地图构建配置已注入"

      - name: Build site
        id: build
        env:
          # Giscus 评论：值来自 GitHub repo Settings → Variables。
          # 未设置时 Giscus.astro 组件自动跳过，不渲染。
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          # 站长平台验证 meta（BaseLayout 条件渲染，未配置不输出）
          PUBLIC_GOOGLE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_VERIFICATION }}
          PUBLIC_BAIDU_VERIFICATION: ${{ vars.PUBLIC_BAIDU_VERIFICATION }}
          PUBLIC_BING_VERIFICATION: ${{ vars.PUBLIC_BING_VERIFICATION }}
          # 高德 Web JS API：敏感配置只从仓库 Secrets 注入构建产物。
          # 未配置或运行时加载失败时，路线图会自动使用 OpenStreetMap 备用底图。
          PUBLIC_AMAP_JS_KEY: ${{ secrets.PUBLIC_AMAP_JS_KEY }}
          PUBLIC_AMAP_SECURITY_CODE: ${{ secrets.PUBLIC_AMAP_SECURITY_CODE }}
          # 写进 <meta name="build">：部署验收据此确认「用户收到的 HTML」就是这一版（第 102 轮）
          PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      # config.yml 的 schema 只有在浏览器里跑 Decap 才会校验：YAML 合法不代表
      # Decap 认（多一个键就白屏）。这里用无头浏览器真的加载 dist/admin/，
      # 报配置错就挡住这次部署；浏览器装不上时脚本自己降级为警告。
      # 内容新鲜度不在这里报（第 97 轮移走）。原先是写 `content/freshness` commit status，
      # 结果日报停更的那几天**每个提交都挂红叉**，把真正的部署/烟测失败淹掉了。
      # 现在改由 .github/workflows/freshness-watch.yml 维护一条 GitHub Issue（可关、会发邮件、
      # 不污染代码状态），判断阈值仍然是 scripts/check-freshness.mjs 那一套。
      - name: Verify social share cards
        id: og
        run: npm run check:og

      # canonical / 描述 / 单一 h1 / JSON-LD 结构化数据，逐页校验 1140 个页面。
      # 和分享卡巡查一样，属于"坏了没人报错、但 Google 静默降权"的那类问题：
      # 2026-11 建这个门禁时才发现 718 个日报页有 2~10 个 h1、134 个页面
      # 一条结构化数据都没有。
      - name: Verify SEO and structured data
        id: seo
        run: npm run check:seo

      - name: Validate admin (Decap) config
        id: admin
        run: |
          npx playwright install chromium || echo "::warning::playwright chromium 安装失败，校验将降级为跳过"
          npm run check:admin

      - name: Runtime smoke (JS errors, failed requests, CLS)
        # 静态检查看不见「island 水合抛错」「图表访问 undefined」「懒加载资源 404」。
        # 这一步用真实 Chromium 打开 21 个代表页面，抓 pageerror / 控制台错误 / 同源 4xx，
        # 顺带量 LCP / CLS / 长任务：CLS > 0.1 直接卡住（布局抖动是结构问题，不随机）。
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 把输出留住：失败时用 ::error:: 打出来，这样检查结果能从 GitHub API 的
          # annotations 读到——仓库没开管理员权限，日志接口是 403 的，只看得到注释。
          # CI 用 Playwright 自带的 headless Chromium，本机用系统 Chrome，两者布局/时序
          # 不完全一致；CLS 这里放宽到 0.25（"good" 线的 2.5 倍）——
          # 它拦得住 0.232 那种结构性抖动，但不会被环境噪声搞成假红。
          # 本地要严格就用默认值（0.1）。
          # GitHub Actions 的 run: 默认是 bash -e：命令一失败 shell 立刻退出，
          # 下面的 code=$? / cat 日志 / ::error:: 注解全都是死代码（第 92 轮才发现：
          # 交互自检红了，注解里只有一句「exit code 1」，一条场景名都没有）。
          # 所以先 set +e 关掉 -e，再自己判断退出码。
          set +e
          npm run check:runtime -- --vitals --cls=0.12 --lcp=8000 > /tmp/runtime.log 2>&1
          code=$?
          cat /tmp/runtime.log
          if [ "$code" -eq 2 ]; then
            echo "::warning::运行时自检跳过：Chromium 不可用"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::运行时自检失败（exit $code），以下是被打回的页面："
            tail -40 /tmp/runtime.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          node scripts/report-ci-status.mjs --context=smoke/runtime --state=$([ "$code" -eq 0 ] && echo success || echo failure) --log=/tmp/runtime.log
          exit "$code"

      - name: Runtime smoke (mobile 390x844)
        # 窄屏会重排/折叠：导航抽屉、图表 2 列网格、灯箱全屏都只在手机上出现。
        # 只抽查 12 个关键模板，避免把部署时间翻倍。
        id: runtime-mobile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run check:runtime -- --mobile > /tmp/runtime-mobile.log 2>&1
          code=$?
          cat /tmp/runtime-mobile.log
          if [ "$code" -eq 2 ]; then
            echo "::warning::移动端运行时自检跳过：Chromium 不可用"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::移动端运行时自检失败（exit $code）："
            grep -E "^(✗|  ·)" /tmp/runtime-mobile.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          node scripts/report-ci-status.mjs --context=smoke/runtime-mobile --state=$([ "$code" -eq 0 ] && echo success || echo failure) --log=/tmp/runtime-mobile.log
          exit "$code"

      - name: Font environment (which fallback does the runner actually have)
        # 第 149 轮：弱网 CLS 的归因卡在"runner 上兜底字体到底是谁"。这一行不做判断，
        # 只让环境自己说话 —— 装了哪些字体、各自需要多少 size-adjust。
        id: font-env
        continue-on-error: true
        run: |
          set +e
          # --layout-diff：同一页「拦字体 vs 正常」两趟，比首屏元素的高度 —— 不依赖时序，
          # 谁的排版在换字体时变了、变多少，直接给出来（第 150 轮）
          out=$(node scripts/report-font-env.mjs --json --layout-diff 2>&1 | tail -1)
          echo "字体环境：$out"
          if [ -n "$out" ]; then echo "::notice::字体环境（runner 实测）：$out"; fi

      - name: Mobile perf baseline (throttled, only for the record)
        # 无节流时首屏指标永远是「局域网速度」：第 73 轮那个「LCP 被 15KB 衬线字体排队
        # 卡到 1.6 s」的问题，在 21 页无节流自检里只表现为「/ LCP 1220 ms」，看着不严重。
        # 这里按 Lighthouse 默认档（1.6 Mbps / 150 ms / CPU 4×）跑 6 个代表页 × 2 次取中位，
        # 把「真实手机首屏」写进日志与 notice。
        # 只记录、不挡发布：弱网 LCP 受 runner 负载影响大（±30%），硬卡会变成假红；
        # 真正的闸门仍然是无节流 CLS（结构问题，不随机）与 JS/HTTP 报错。
        #
        # 第 74 轮第一次加这步时漏了 continue-on-error / set +e：默认预算在 2 核 runner 上
        # 被弱网数字顶超，bash -e 直接让整条部署变红（诊断还显示 unknown step）。纯记录步骤
        # 必须自己咽掉失败。
        id: perf-mobile
        continue-on-error: true
        run: |
          set +e
          # 预算放到「只在离谱时才失败」，反正失败也不挡发布
          # --explain：位移详情带上 y/h 变化（"被顶下去多少像素、哪一块长高了"），
          # 配合 check-runtime 新加的 ::notice:: 才能从注解里定位（第 148 轮）
          npm run check:perf -- --explain --limit=6 --repeat=2 --cls=0.5 --lcp=30000 > /tmp/perf-mobile.log 2>&1
          code=$?
          cat /tmp/perf-mobile.log
          summary=$(grep -E "核心指标" /tmp/perf-mobile.log || true)
          if [ -n "$summary" ]; then
            echo "::notice::弱网首屏（1.6 Mbps / CPU 4×，中位）：${summary}"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::弱网首屏自检未通过（exit $code），仅记录，不影响发布"
          fi
          exit 0

      - name: Interaction smoke (search, lightbox, vote, theme)
        # 加载不报错 ≠ 交互不报错：搜索（pagefind）、灯箱（PhotoSwipe）、点赞（乐观更新 +
        # POST /api/feedback）、深浅色切换都是岛里的代码，只有真的点下去才会执行。
        # /api/* 用 stub 提供最小契约，链路在本地也能全量验证。
        id: interactions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # GitHub Actions 的 run: 默认是 bash -e：命令一失败 shell 立刻退出，
          # 下面的 code=$? / cat 日志 / ::error:: 注解全都是死代码（第 92 轮才发现：
          # 交互自检红了，注解里只有一句「exit code 1」，一条场景名都没有）。
          # 所以先 set +e 关掉 -e，再自己判断退出码。
          set +e
          npm run check:interactions > /tmp/interactions.log 2>&1
          code=$?
          cat /tmp/interactions.log
          if [ "$code" -eq 2 ]; then
            echo "::warning::交互自检跳过：Chromium 不可用"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::交互自检失败（exit $code）："
            grep -E "^(✗|    )" /tmp/interactions.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            # 兜底：脚本可能在打 ✗ 之前就抛错（serveDist / 浏览器启动 / 超时），
            # 那样 grep 一条也匹配不到，注解里就只剩「Process completed with exit code 1」。
            echo "::error::交互自检日志尾部（排查用）："
            tail -20 /tmp/interactions.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          node scripts/report-ci-status.mjs --context=smoke/interactions --state=$([ "$code" -eq 0 ] && echo success || echo failure) --log=/tmp/interactions.log
          exit "$code"

      - name: Stamp release identity
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("dist/deploy-meta.json", "w", encoding="utf-8") as handle:
              json.dump({"sha": os.environ["GITHUB_SHA"], "built_at": datetime.now(timezone.utc).isoformat()}, handle)
              handle.write("\n")
          PY

      - name: Verify required secrets
        id: secrets
        run: |
          # 前置自检：缺哪个 secret 明确报错
          missing=()
          [ -z "$SSH_HOST" ]    && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ]    && missing+=("SSH_USER")
          [ -z "$DEPLOY_PATH" ] && missing+=("DEPLOY_PATH")
          if [ -n "${missing[*]}" ]; then
            echo "❌ 缺少 GitHub Secret(s): ${missing[*]}"
            exit 1
          fi

          # 只做格式校验，不在公开 Actions 日志输出基础设施指纹或长度。
          if printf "%s" "$SSH_HOST" | grep -qE "^[[:space:]]|[[:space:]]$|^http|/$"; then
            echo "❌ SSH_HOST 看起来异常（含空白 / http 前缀 / 末尾斜杠）"
            exit 1
          fi
          if printf "%s" "$SSH_USER" | grep -qE "^[[:space:]]|[[:space:]]$|/"; then
            echo "❌ SSH_USER 含空白或斜杠"
            exit 1
          fi
          if ! printf "%s" "${DEPLOY_PATH%/}" | grep -qE "^/[A-Za-z0-9._/-]+/dist$"; then
            echo "❌ DEPLOY_PATH 必须是无空格的绝对路径并以 /dist 结尾"
            exit 1
          fi
          echo "✓ 三个 secret 看起来格式 OK"

      - name: Setup SSH key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # SSH_DEPLOY_KEY 是 base64 编码的单行字符串；解码后才是 OpenSSH 私钥
          echo "$SSH_DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1 | grep -v "^#" | head -5
          # 静默验证私钥可解析；不要把私钥的任何片段写入 Actions 日志。
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Reconcile AMap CSP allowlist
        run: |
          # 高德 SDK、运行时数据与 Giscus 样式必须通过 CSP。配置修改前保留备份，
          # nginx 语法检查失败时立即恢复，避免安全头更新影响整个站点。
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$GITHUB_SHA" <<'SH'
          set -eu
          sha=$1
          if [ "$(id -u)" -eq 0 ]; then
            as_root=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            as_root="sudo -n"
          else
            echo "❌ 部署账号没有更新 nginx CSP 所需的免密 sudo 权限"
            exit 1
          fi
          echo "[csp] 定位 active nginx 安全头配置"
          # 从 nginx -T 的 active include 图谱取文件，兼容没有 .conf 后缀的 snippet。
          target=$($as_root nginx -T 2>&1 | awk '
            /^# configuration file / { file=$4; sub(/:$/, "", file) }
            /Content-Security-Policy/ && file { print file; exit }
          ')
          if [ -z "$target" ]; then
            echo "❌ /etc/nginx 中没有找到 Content-Security-Policy 配置"
            exit 1
          fi
          backup="/tmp/zorotreeking-csp-$sha.conf"
          echo "[csp] 备份并更新白名单"
          $as_root cp "$target" "$backup"
          if ! $as_root python3 - "$target" <<'PY'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          def allow(directive: str, origins: list[str], text: str, create_after=None) -> str:
              pattern = re.compile(rf"({re.escape(directive)}\s+)([^;]*)(;)")
              match = pattern.search(text)
              if not match:
                  if not create_after:
                      raise SystemExit(f"missing CSP directive: {directive}")
                  anchor = re.compile(rf"({re.escape(create_after)}\s+[^;]*;)").search(text)
                  if not anchor:
                      raise SystemExit(f"missing CSP anchor directive: {create_after}")
                  addition = f" {directive} {' '.join(origins)};"
                  return text[:anchor.end()] + addition + text[anchor.end():]
              values = match.group(2).split()
              for origin in origins:
                  if origin not in values:
                      values.append(origin)
              return text[:match.start()] + match.group(1) + " ".join(values) + match.group(3) + text[match.end():]

          source = allow("script-src", [
              "https://webapi.amap.com",
              "https://restapi.amap.com",
              "https://jsapi-service.amap.com",
              "https://mapplugin.amap.com",
          ], source)
          source = allow("style-src", ["https://giscus.app"], source)
          source = allow("worker-src", ["'self'", "blob:"], source, create_after="script-src")
          source = allow("connect-src", ["https://*.amap.com", "https://*.autonavi.com"], source)
          path.write_text(source, encoding="utf-8")
          PY
          then
            $as_root cp "$backup" "$target"
            exit 1
          fi
          echo "[csp] 校验并重新加载 nginx"
          if ! $as_root nginx -t; then
            $as_root cp "$backup" "$target"
            $as_root nginx -t
            exit 1
          fi
          if ! $as_root systemctl reload nginx; then
            $as_root cp "$backup" "$target"
            $as_root nginx -t
            $as_root systemctl reload nginx
            exit 1
          fi
          echo "✓ 运行时 CSP 白名单已核对"
          SH

          # 从公网响应确认 active nginx 已加载新策略，而不是只改了磁盘文件。
          csp=$(curl -fsSI https://www.zorotreeking.online/hike/ | tr -d '\r' | grep -i '^content-security-policy:')
          printf '%s' "$csp" | grep -q 'https://webapi.amap.com'
          printf '%s' "$csp" | grep -q 'https://restapi.amap.com'
          printf '%s' "$csp" | grep -q 'https://jsapi-service.amap.com'
          printf '%s' "$csp" | grep -q 'https://mapplugin.amap.com'
          printf '%s' "$csp" | grep -q "worker-src 'self' blob:"
          printf '%s' "$csp" | grep -q 'https://\*.amap.com'
          printf '%s' "$csp" | grep -Eq 'style-src [^;]*https://giscus\.app([ ;])'
          echo "✓ 公网 CSP 已允许高德 SDK、运行时请求与 Giscus 样式"

      - name: Prepare versioned release
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" "$GITHUB_SHA" <<'SH'
          set -eu
          release_root=$1
          sha=$2
          target="$release_root/releases/$sha"
          mkdir -p "$target"
          # Seed unchanged files as hard links from the active release. The
          # following checksum rsync then transfers only genuinely changed bytes.
          if [ -L "$release_root/current" ]; then
            current=$(readlink -f "$release_root/current")
            test -d "$current"
            cp -al "$current"/. "$target"/
          fi
          SH

      - name: Rsync dist → versioned release
        id: rsync
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          # --checksum：CI 每次都重新 build，所有文件 mtime 都是新的，光靠
          # size+mtime 会让 189MB HTML 全部重传；checksum 模式只传真正变了的字节。
          # --stats 把实际传输量写进日志，方便判断增量是否生效。
          #
          # 重试 + 超时：跨境链路会偶发劣化（2026-11-10 晚 runner→服务器实测掉到
          # 15KB/s，同一时刻本机直传是 2.4MB/s），一次失败就整轮白跑太亏。
          #   --timeout=180     连续 3 分钟没有进展就放弃本次尝试，而不是挂到 job 超时
          #   ServerAlive       SSH 层心跳，避免半开连接一直等待
          # 重试是幂等的：目标目录内容由 checksum 判定，重复 rsync 只会继续补齐。
          attempt=1
          while :; do
            echo "::group::rsync attempt $attempt"
            if rsync -az --checksum --stats --delete --no-perms --no-owner --no-group \
                 --timeout=180 \
                 -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
                 dist/ "$SSH_USER@$SSH_HOST:$release_root/releases/$GITHUB_SHA/"; then
              echo "::endgroup::"
              echo "rsync succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -ge 3 ]; then
              echo "rsync failed after $attempt attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "transfer failed, retrying in 30s (attempt $attempt/3)"
            sleep 30
          done

      - name: Activate release atomically
        id: activate
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" "$GITHUB_SHA" <<'SH'
          set -eu
          release_root=$1
          sha=$2
          new_release="$release_root/releases/$sha"
          test -f "$new_release/deploy-meta.json"
          if [ -L "$release_root/current" ]; then
            old_release=$(readlink -f "$release_root/current")
            ln -sfn "$old_release" "$release_root/previous"
          elif [ -d "$release_root/dist" ]; then
            ln -sfn "$release_root/dist" "$release_root/previous"
          fi
          ln -sfn "$new_release" "$release_root/current.next"
          mv -Tf "$release_root/current.next" "$release_root/current"
          SH

      - name: Prune old releases
        # 每个 release 约 3000 个文件（大部分是 --link/hardlink 共享），但目录会无限堆积：
        # 2026-11 时已有 1343 个 release / 6.1GB。保留最近 20 个，current 与 previous
        # 指向的永远不删。失败不阻塞部署。
        continue-on-error: true
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" 20 <<'SH'
          set -eu
          root=$1
          keep=$2
          [ -d "$root/releases" ] || exit 0
          cur=$(readlink -f "$root/current" 2>/dev/null || true)
          prev=$(readlink -f "$root/previous" 2>/dev/null || true)
          removed=0
          kept=$(ls -1 "$root/releases" | wc -l)
          for d in $(ls -1t "$root/releases" | tail -n "+$((keep + 1))"); do
            # 只处理 40 位 git sha 目录，避免误删别的目录
            case "$d" in
              *[!0-9a-f]*) continue ;;
            esac
            [ ${#d} -eq 40 ] || continue
            p="$root/releases/$d"
            [ "$p" = "$cur" ] && continue
            [ "$p" = "$prev" ] && continue
            rm -rf "$p"
            removed=$((removed + 1))
          done
          echo "releases: $kept → $(ls -1 "$root/releases" | wc -l)（本次清理 $removed 个）"
          SH

      # 修权限（第 80 轮）：生产上有 pagefind 碎片稳定返回 403 —— 文件在、nginx 读不了。
      # 成因是 `rsync --no-perms` 写临时文件时留下的 0600 位（新文件不走 chmod），加上
      # `cp -al` 会把上一次 release 的权限位硬链接继承下来。症状很隐蔽：只有**部分**
      # 搜索关键词坏掉，页面本身、CSS、字体全部正常，现有烟测都发现不了。
      # 这里在激活后统一补 o+r，并且把 previous 也修一遍，避免回滚到坏的那份。
      - name: Repair file readability in the active release
        continue-on-error: true
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" <<'SH'
          set -eu
          release_root=$1
          for link in current previous; do
            [ -L "$release_root/$link" ] || continue
            dir=$(readlink -f "$release_root/$link")
            test -d "$dir" || continue
            fixed=$(find "$dir" -type f ! -perm -o+r -exec chmod o+r {} + -print | wc -l | tr -d ' ')
            echo "$link: $fixed 个文件补了 o+r（$dir）"
          done
          SH

      # 严格核对（第 81 轮）：修完之后必须**真的**一个不可读文件都不剩。
      # 这一步只花一次 SSH，不产生任何 HTTP 请求 —— 全量核对 3000+ 文件如果走 HTTP，
      # 会直接把探针 IP 打进服务器的频控里（第 81 轮实测：连打 1453 个请求后本机被 reset）。
      - name: Verify every file in the release is world-readable
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" <<'SH'
          set -eu
          release_root=$1
          status=0
          for link in current previous; do
            [ -L "$release_root/$link" ] || continue
            dir=$(readlink -f "$release_root/$link")
            test -d "$dir" || continue
            count=$(find "$dir" -type f ! -perm -o+r | wc -l | tr -d ' ')
            echo "$link: $count 个不可读文件"
            if [ "$count" != "0" ]; then
              find "$dir" -type f ! -perm -o+r | head -20
              status=1
            fi
          done
          exit $status
          SH

      - name: API surface probe (does every /api still answer?)
        # 这些接口都藏在"前端静默降级"后面：挂了页面照样打开，只是那块悄悄空了。
        # 探针同时验证鉴权守卫（后台接口不带 token 必须被拒），见 scripts/verify-api-surface.mjs。
        run: |
          set +e
          node scripts/verify-api-surface.mjs --base=https://www.zorotreeking.online
          code=$?
          [ "$code" -eq 0 ] || echo "::error::/api 接口面有接口不可用（见上方 ✗ 行）"
          exit "$code"

      - name: Production acceptance smoke test
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          last = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen("https://www.zorotreeking.online/deploy-meta.json", timeout=20) as resp:
                      meta = json.load(resp)
                  if meta.get("sha") != os.environ["GITHUB_SHA"]:
                      raise ValueError(f"static release mismatch: {meta.get('sha')}")
                  # 「用户收到的 HTML」必须就是这一版：deploy-meta.json 只能证明那个文件换新了，
                  # nginx 缓存 / CDN 让人拿到旧 HTML 时它照样是绿的（第 102 轮）。
                  with urllib.request.urlopen("https://www.zorotreeking.online/", timeout=20) as resp:
                      html = resp.read().decode("utf-8", "replace")
                  stamp = re.search(r'<meta name="build" content="([^"]*)"', html)
                  if not stamp:
                      raise ValueError("homepage has no <meta name=\"build\"> stamp")
                  if stamp.group(1) != os.environ["GITHUB_SHA"]:
                      raise ValueError(
                          f"stale HTML at the edge: build={stamp.group(1)} expected={os.environ['GITHUB_SHA']}"
                      )
                  with urllib.request.urlopen("https://www.zorotreeking.online/hike/", timeout=20) as resp:
                      csp = resp.headers.get("Content-Security-Policy", "")
                  required_amap_origins = (
                      "https://webapi.amap.com",
                      "https://restapi.amap.com",
                      "https://jsapi-service.amap.com",
                      "https://mapplugin.amap.com",
                      "https://*.amap.com",
                      "worker-src 'self' blob:",
                  )
                  if not all(origin in csp for origin in required_amap_origins):
                      raise ValueError("AMap CSP allowlist missing from production response")
                  if not re.search(r"style-src [^;]*https://giscus\.app(?: |;)", csp):
                      raise ValueError("Giscus stylesheet origin missing from style-src")
                  # 点赞接口：线上 GET 曾经长期 422（每篇文章底部的计数永远为空，没人发现）。
                  # 这条断言只验证「接口还能正常回 JSON」，不写任何投票数据（用探针 slug）。
                  with urllib.request.urlopen(
                      "https://www.zorotreeking.online/api/feedback?slug=item%3Adeploy-probe", timeout=20
                  ) as resp:
                      feedback = json.load(resp)
                  for key in ("likes", "dislikes", "my_vote"):
                      if key not in feedback:
                          raise ValueError(f"/api/feedback response is missing {key}: {feedback}")
                  with urllib.request.urlopen("https://www.zorotreeking.online/api/market/etf", timeout=20) as resp:
                      data = json.load(resp)
                  items = data.get("items") or []
                  missing = [x.get("code") for x in items if x.get("ratio_pct") is None]
                  codes = [x.get("code") for x in items]
                  # 开盘前（约 08:30 数据源切到新交易日、09:30 才有成交）所有
                  # turnover 都是 0，ratio 自然算不出来。2026-11-11 08:48 的部署
                  # 就是被这个窗口挡下来的：静态发布本身完全没问题，被一个
                  # 与发布无关的行情状态连坐。区分两种情况：
                  #   · 盘前无成交 → 只发警告，不挡发布
                  #   · 有成交却算不出 ratio → 契约坏了，照旧失败
                  premarket = (
                      bool(items)
                      and all(x.get("turnover_yi") in (0, 0.0, None) for x in items)
                      and data.get("trading") is False
                  )
                  if data.get("ok") is True and len(items) == 12 and data.get("baseline_date") and (not missing or premarket):
                      note = "盘前无成交，ratio 待开盘" if missing else "12/12"
                      print(f"✓ static sha={meta['sha']} · AMap CSP ready · ETF API {note} · baseline={data['baseline_date']}")
                      if missing:
                          print(f"::warning::ETF realtime ratios unavailable before the open ({len(missing)}/12) — data feed state, not this release")
                      break
                  last = {"count": len(items), "missing": missing, "codes": codes, "baseline": data.get("baseline_date"), "premarket": premarket}
              except Exception as exc:
                  last = str(exc)
              if attempt < 5:
                  time.sleep(10)
          else:
              raise SystemExit(f"ETF production smoke failed: {last}")
          PY

      # 搜索可用性验收（第 80 轮）：碎片权限/未发布只有真跑一次查询才照得出来。
      # 失败会落到下一个 step（回滚），所以这是个真闸门而不是记录。
      - name: Production search probe (pagefind fragments must be readable)
        if: steps.activate.outcome == 'success'
        run: node scripts/check-search.mjs --base=https://www.zorotreeking.online

      - name: Roll back failed release
        if: failure() && steps.activate.outcome == 'success'
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" <<'SH'
          set -eu
          release_root=$1
          test -L "$release_root/previous"
          previous=$(readlink -f "$release_root/previous")
          test -d "$previous"
          ln -sfn "$previous" "$release_root/current.rollback"
          mv -Tf "$release_root/current.rollback" "$release_root/current"
          echo "Rollback completed"
          SH

      # 失败或被取消时，把本次 sha 的半成品目录删掉：rsync 传了一半的目录
      # 既占磁盘也会让 releases 计数虚高。只动 releases/<本次 sha>，绝不碰
      # current/previous。
      - name: Drop half-written release
        if: failure() || cancelled()
        run: |
          release_root="${DEPLOY_PATH%/}"
          release_root="${release_root%/dist}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            sh -s -- "$release_root" "$GITHUB_SHA" <<'SH' || true
          set -eu
          release_root=$1
          sha=$2
          cur=$(basename "$(readlink -f "$release_root/current")")
          prev=$(basename "$(readlink -f "$release_root/previous" 2>/dev/null || echo /nonexistent)")
          if [ "$sha" = "$cur" ] || [ "$sha" = "$prev" ]; then
            echo "refusing to delete active release $sha"
            exit 0
          fi
          if [ -d "$release_root/releases/$sha" ]; then
            rm -rf "$release_root/releases/$sha"
            echo "removed half-written release $sha"
          fi
          SH

      # 通知 IndexNow（Bing/Yandex/Naver/Seznam）新增/改动 URL，加速索引
      # 失败不阻塞 deploy
      - name: Ping IndexNow
        continue-on-error: true
        run: npx tsx scripts/indexnow-ping.ts

      # 百度普通收录主动推送（百度不支持 IndexNow）
      # BAIDU_PUSH_TOKEN 未配置时脚本自动跳过
      - name: Push to Baidu
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: npx tsx scripts/baidu-push.ts

      # 失败诊断：Actions 日志要登录才能看（本仓库维护者长期没有 token），
      # 所以把关键步骤的 outcome 直接写成 commit status。公开仓库读 status 不需要权限，
      # `GET /repos/:owner/:repo/commits/:sha/statuses` 就能看到是哪一步红的。
      - name: Diagnose failed step
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }}
            install=${{ steps.install.outcome }}
            tests=${{ steps.tests.outcome }}
            typecheck=${{ steps.typecheck.outcome }}
            etf=${{ steps.etf.outcome }}
            amap=${{ steps.amap.outcome }}
            build=${{ steps.build.outcome }}
            og=${{ steps.og.outcome }}
            seo=${{ steps.seo.outcome }}
            admin=${{ steps.admin.outcome }}
            runtime=${{ steps.runtime.outcome }}
            runtime-mobile=${{ steps.runtime-mobile.outcome }}
            perf-mobile=${{ steps['perf-mobile'].outcome }}
            interactions=${{ steps.interactions.outcome }}
            secrets=${{ steps.secrets.outcome }}
            rsync=${{ steps.rsync.outcome }}
        run: |
          echo "步骤结果: $OUTCOMES"
          DESC=""
          for kv in $OUTCOMES; do
            case "$kv" in
              *=failure|*=cancelled) DESC="$DESC ${kv%%=*}" ;;
            esac
          done
          if [ -z "$DESC" ]; then DESC="unknown step"; fi
          echo "失败步骤:$DESC"
          PAYLOAD=$(printf '{"state":"failure","context":"ci/failed-step","description":"%s"}' "$(printf '%s' "$DESC" | cut -c1-130)")
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" || true

      - name: Summary
        run: |
          # 不打印 SSH_HOST / DEPLOY_PATH，防止公开 Actions 日志泄露
          echo "Deployed ✓"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"

  # 为什么单独一个 job（第 114 轮）：补跑要抓源 ~17 分钟再翻译，塞进部署 job 会把**已经完成**
  # 的部署拖过 30 分钟上限，变成"站点更新了、run 却是红的"。拆开后两条命互不影响：部署照旧
  # 12 分钟内结束，补跑有自己的预算；补跑失败只是这个 job 黄，continue-on-error 保证整条 run 不变红。
      # 第 153 轮：site-audit.yml / a11y.yml / freshness-watch.yml 三个 workflow 全靠 cron，
      # 而实测 cron **会整周不触发**（第 145 轮，日报停更两天同因）—— 于是这些巡检从没跑过，
      # 只让人误以为"有人在看"。独立调度器要改运行环境、得人来定；但"部署时顺手补一次"
      # 不需要新依赖，和 catch-up-digest / refresh-us-macro 是同一套自愈模式。
      # 判旧才跑（7 天），报告进 reports/，戳记进 src/data/weekly-audit.json。
      - name: Weekly audit (piggyback on deploy, 七天一次)
        id: weekly-audit
        run: |
          # 巡检永远不挡发布：发现问题的表达方式是报告 + 注解，不是红叉。
          set +e
          node scripts/weekly-audit.mjs --max-age-days=7
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::每周巡检脚本自身出错（exit $code），本轮跳过"
          fi
          exit 0

      - name: Commit weekly audit report (if it ran)
        if: steps.weekly-audit.outputs.skipped != 'true'
        run: |
          set +e
          # reports/ 是 gitignore 的（历史产物不进仓库），所以这里必须 -f，否则
          # `git add` 会因为"路径被忽略"整体失败、什么都没暂存，然后下面静默输出
          # "没有新结果" —— 第 153 轮实测踩过：巡检跑了，戳记和报告却没进仓库。
          git add -f src/data/weekly-audit.json
          # 通配符没匹配到文件时 `git add` 会整条失败（sh 不做 nullglob 展开），
          # 所以先判断再添加 —— 第 153 轮第二次踩坑：戳记进了仓库、报告没进。
          if ls reports/weekly-audit-*.md >/dev/null 2>&1; then
            git add -f reports/weekly-audit-*.md
          else
            echo "::warning::没有找到巡检报告文件（reports/weekly-audit-*.md）"
          fi
          if git diff --cached --quiet; then
            echo "::warning::巡检跑完了但没有可提交的产物（戳记/报告没生成？）"
            exit 0
          fi
          git config user.name "zorotreeking-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "audit: weekly check $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          if ! git push origin main; then
            echo "::warning::巡检报告推送失败，下次部署会重跑（戳记没进仓库，下一次仍会判旧）"
          fi

  catch-up-digest:
    needs: build-and-deploy
    if: success() && (github.event_name == 'push' || github.event_name == 'schedule')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
      actions: write   # 下面要用 dispatch 把新内容部署出去
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Catch up a missed digest (self-healing)
        # 只在「内容真的停更」时才动：判定复用 check-freshness，产出 commit 回仓库，
        # 并顺带触发下一次部署（那一次构建才会带上新内容）。
        # 本仓库的 schedule 实测延迟 5–7.5 小时，还出现过整天不触发；2026-11-19 起 AI 日报
        # 连续三天没产出，而站点照常构建、门禁全绿 —— 只有人肉看才会发现。
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          set +e
          # 日志排障：这个仓库的 Actions 日志接口是 403，只能看 annotations。
          # 所以每个关键结论都打成 ::warning:: / ::notice::，再抄一份进 step summary，
          # 出问题时能从 API 读出原因，而不是只看到一个绿勾（第 114 轮踩过）。
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "${DOUBAO_API_KEY:-}${ARK_API_KEY:-}" ]; then
            echo "::warning::没有 LLM key（DOUBAO_API_KEY / ARK_API_KEY），跳过敏捷补跑"
            exit 0
          fi
          # --ignore-gaps：11-19/11-20 是抓取窗口已过的历史断档，永远补不回来。
          # 不带它的话每次部署都会误判"停更"并白跑一遍 LLM 抓取（第 147 轮实测：
          # 每次部署都打「检测到内容停更，尝试补跑一次日报」，其实内容是最新的）。
          npx tsx scripts/check-freshness.mjs --max-age=2 --ignore-gaps > /tmp/freshness.log 2>&1
          STALE=$?
          if [ "$STALE" -eq 0 ]; then
            note "✓ 内容新鲜，无需补跑。"
            exit 0
          fi
          note "::warning::检测到内容停更，尝试补跑一次日报"
          cat /tmp/freshness.log | tail -5 >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/digest-fetch.ts both > /tmp/fetch.log 2>&1
          FETCH=$?
          if [ "$FETCH" -ne 0 ]; then
            REASON=$(grep -viE "^(npm |\$ |> )" /tmp/fetch.log | tail -4 | tr '\n' ' ' | cut -c1-300)
            echo "::warning::补跑没产出（exit $FETCH）：$REASON"
            echo "补跑失败原因（exit $FETCH）：$REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 只生成中文是不够的：全站模板按"中英成对"处理（语言切换、hreflang、站内链接检查都
          # 假设 en 版存在），缺 en 会立刻产生死链 —— 第 113 轮第一次补跑就撞上了。
          npx tsx scripts/translate-digest.ts --limit=4 > /tmp/translate.log 2>&1 || {
            REASON=$(tail -3 /tmp/translate.log | tr '\n' ' ' | cut -c1-240)
            echo "::warning::英文版翻译失败，宁可回滚也不发单语内容：$REASON"
          }
          # 质量闸 1：摘要失败的那几条会写成"（LLM 摘要失败…）"，阈值允许 30% 以内失败，
          # 于是个别占位符会混进正文发出去（线上已有 40 篇历史）。补跑不能往里添新的。
          if ! node scripts/check-digest-placeholders.mjs --days=0; then
            echo "::warning::生成的内容里有占位符，回滚，不发布半成品"
            git checkout -- src/content
            exit 0
          fi
          # 质量闸 2：中英必须成对，否则站内立刻出现 /en/... 死链（check:links 会红）
          MISSING=0
          for f in $(git status --porcelain src/content | awk '{print $2}' | grep '\.zh\.mdx$'); do
            en="${f%.zh.mdx}.en.mdx"
            [ -f "$en" ] || { echo "::warning::$f 没有对应的 en 版"; MISSING=1; }
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::warning::补跑产出不完整（缺英文版），回滚，不发布半成品"
            git checkout -- src/content
            exit 0
          fi
          # 只提交内容目录，避免把其它工作区改动带进来
          git config user.name "zorotreeking-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content
          if git diff --cached --quiet; then
            echo "没有新增内容，放弃提交（不制造空提交）。"
            exit 0
          fi
          git commit -m "content: catch up a missed digest run"
          git pull --rebase --autostash origin main || true
          if ! git push origin main; then
            echo "::warning::补跑内容推送失败，下次部署会再试"
            exit 0
          fi
          # 关键（第 114 轮实测）：用 GITHUB_TOKEN 推的 commit **不会触发任何 workflow**
          # （GitHub 防递归规则），所以这次 push 不会自动部署 —— 内容躺在仓库里但站点不变。
          # workflow_dispatch / repository_dispatch 是例外，可以手动发起一次部署。
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
               -f ref=main --silent; then
            note "✓ 已提交补跑内容并触发一次部署"
          else
            echo "::warning::内容已提交，但触发部署失败 —— 需要下一次 push 或 15:30 的定时部署才会生效"
          fi

      - name: Weekly roundup (self-healing, 只在缺的时候生成)
        # 为什么在这里（第 161 轮）：`weekly-roundup.yml` 只有 cron（周日 09:00 北京），
        # 而这个仓库的 schedule 实测延迟 5–7.5 小时、甚至整天不触发。周日没跑 →
        # 「本周看点」永久缺一期，站点照常构建、门禁全绿、没人发现。
        # 这里跟着每次部署顺手检查：目标周 = 最近一个周日的 ISO 周（周日当天就是本周，
        # 周一到周六就是刚结束的那周），缺才生成/missing_en 才翻译，已有就一句话跳过。
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          set +e
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          node scripts/check-weekly-roundup.mjs --json > /tmp/roundup.json 2>&1
          STATE=$?
          WEEK=$(node -e 'console.log(require("/tmp/roundup.json").week||"")' 2>/dev/null)
          note "本周看点检查（exit $STATE）：$(cat /tmp/roundup.json | tr '\n' ' ' | cut -c1-200)"
          if [ "$STATE" -eq 0 ]; then
            note "✓ 本周看点 $WEEK 中英都在，无需动作。"
            exit 0
          fi
          if [ -z "${DOUBAO_API_KEY:-}${ARK_API_KEY:-}" ]; then
            echo "::warning::本周看点缺 $WEEK，但没有 LLM key，跳过生成"
            exit 0
          fi
          if [ "$STATE" -eq 10 ]; then
            note "::warning::缺 $WEEK 的周报，尝试生成"
            if ! npx tsx scripts/weekly-roundup.ts > /tmp/roundup.log 2>&1; then
              REASON=$(grep -viE "^(npm |\$ |> )" /tmp/roundup.log | tail -4 | tr '\n' ' ' | cut -c1-300)
              echo "::warning::周报生成失败：$REASON"
              echo "生成失败原因：$REASON" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # zh 有了还是缺 en：站点模板按"中英成对"处理，缺 en 会立刻产生死链
          if ! npx tsx scripts/translate-digest.ts --limit=2 > /tmp/roundup-tr.log 2>&1; then
            REASON=$(tail -3 /tmp/roundup-tr.log | tr '\n' ' ' | cut -c1-240)
            echo "::warning::周报英文版翻译失败，回滚，不发单语内容：$REASON"
            git checkout -- src/content
            exit 0
          fi
          # 质量闸：占位符（"摘要失败"）与中英成对
          if ! node scripts/check-digest-placeholders.mjs --days=0; then
            echo "::warning::周报里有占位符，回滚，不发布半成品"
            git checkout -- src/content
            exit 0
          fi
          node scripts/check-weekly-roundup.mjs > /tmp/roundup-after.log 2>&1
          if [ $? -ne 0 ]; then
            echo "::warning::周报产出不完整：$(tail -2 /tmp/roundup-after.log | tr '\n' ' ')"
            git checkout -- src/content
            exit 0
          fi
          git config user.name "zorotreeking-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/content/ai/weekly-*.mdx
          if git diff --cached --quiet; then
            note "周报没有新增文件，放弃提交（不制造空提交）。"
            exit 0
          fi
          git commit -m "content: weekly roundup $WEEK"
          git pull --rebase --autostash origin main || true
          if ! git push origin main; then
            echo "::warning::周报推送失败，下次部署会再试"
            exit 0
          fi
          # 用 GITHUB_TOKEN 推的 commit 不会触发 workflow，要手动 dispatch 一次
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
               -f ref=main --silent; then
            note "✓ 已补上本周看点 $WEEK 并触发一次部署"
          else
            echo "::warning::周报已提交，但触发部署失败 —— 需要下一次 push 才会生效"
          fi

      - name: Refresh stale market data (self-healing)
        # 为什么在这里（第 146 轮）：行情/宏观快照由 refresh-us-macro.yml 的 cron 刷新，
        # 但第 145 轮实测 schedule 会延迟甚至整天不触发（日报就是这样停更两天的）。
        # 行情接口是公开的、不需要任何密钥，所以让"每次部署"顺手补一次 —— 判旧才抓。
        # 抓完必须过完整性闸门（verify-us-market-snapshot.mjs）：宁可留旧数据，
        # 也不发一份"一半新一半旧"的快照。
        run: |
          set +e
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          node scripts/check-market-data-age.mjs --json --max-age=2 > /tmp/age.json 2>&1
          AGE=$?
          if [ "$AGE" -eq 0 ]; then
            note "✓ 行情快照新鲜（≤2 天），无需刷新。"
            exit 0
          fi
          note "::warning::行情快照超过 2 天，尝试刷新（公开接口，无需密钥）"
          node scripts/fetch-us-quotes.mjs > /tmp/us-quotes.log 2>&1
          Q=$?
          node scripts/fetch-us-macro.mjs > /tmp/us-macro.log 2>&1
          M=$?
          note "抓取退出码：quotes=$Q macro=$M"
          tail -3 /tmp/us-quotes.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          tail -3 /tmp/us-macro.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          if git diff --quiet -- src/data/us-market-latest.json; then
            note "抓取没有产生变化，不提交（保持原样）"
            exit 0
          fi
          if ! node scripts/verify-us-market-snapshot.mjs; then
            echo "::warning::刷新后的快照不完整，回滚，发布旧但完整的那份"
            git checkout -- src/data
            exit 0
          fi
          git config user.name "zorotreeking-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/us-market-latest.json
          git commit -m "data: refresh us market snapshot"
          git pull --rebase --autostash origin main || true
          if ! git push origin main; then
            echo "::warning::行情快照推送失败，下次部署会再试"
            exit 0
          fi
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
               -f ref=main --silent; then
            note "✓ 已刷新行情快照并触发一次部署"
          else
            echo "::warning::快照已提交，但触发部署失败 —— 需要下一次 push 才会生效"
          fi
