<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZoroTreeking · 管理后台</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- unpkg 上取 Decap，预热连接省一个 RTT -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <!-- 站点字体（与主站一致） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" />

  <style>
    /* ─────────────────────────────────────────────────────
       Decap admin 与主站视觉对齐：Apple 灰白 + Inter + 衬线标题
       原则：只覆盖颜色/字体/圆角/间距，不动布局尺寸，避免破坏 Decap 内部依赖
       ───────────────────────────────────────────────────── */

    :root {
      --zt-bg: #fbfbfd;
      --zt-card: #ffffff;
      --zt-soft: #f5f5f7;
      --zt-soft-2: #ececef;
      --zt-text: #1d1d1f;
      --zt-text-secondary: #515154;
      --zt-text-tertiary: #86868b;
      --zt-border: #e5e5e7;
      --zt-accent: #1d1d1f;
    }

    /* ── 主题：默认跟随系统，右下角可手动切换（记忆在 localStorage） ──
       这里不用 @media 直接写深色，是因为手动开关需要能覆盖系统设置；
       统一由 JS 把最终结果写到 <html data-theme>，CSS 只认这一个属性。 */
    html[data-theme="dark"] {
      --zt-bg: #0b0b0d;
      --zt-card: #151517;
      --zt-soft: #1c1c1f;
      --zt-soft-2: #26262a;
      --zt-text: #f2f2f4;
      --zt-text-secondary: #b5b5bb;
      --zt-text-tertiary: #86868b;
      --zt-border: #2a2a2e;
      --zt-accent: #f2f2f4;
    }
    /* 主按钮底色变浅了，字必须反过来 */
    html[data-theme="dark"] button[class*="primary"],
    html[data-theme="dark"] button[type="submit"],
    html[data-theme="dark"] [data-testid*="publish"],
    html[data-theme="dark"] [class*="PublishButton"],
    html[data-theme="dark"] button[data-zt-role="primary-media"] {
      color: #0b0b0d !important;
    }
    /* 浮动按钮：浅底白字会看不见，改成卡片色 */
    html[data-theme="dark"] .back-to-site {
      background: var(--zt-card) !important;
      color: var(--zt-text) !important;
      border: 1px solid var(--zt-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }
    html[data-theme="dark"] .back-to-site:hover { color: var(--zt-text) !important; }
    html[data-theme="dark"] [class*="AppHeader"],
    html[data-theme="dark"] header[class*="App"],
    html[data-theme="dark"] nav[class*="App"] {
      background: rgba(11, 11, 13, 0.78) !important;
    }
    html[data-theme="dark"] a:hover { color: #fff !important; }

    /* ── 深色下「登录后才出现」的界面 ──
       媒体库模态、编辑器、下拉菜单这些是 Decap 自己写死的浅色。未登录状态
       没法实测，所以只做保守覆盖：容器给深底 + 内部文字转浅，按钮单独兜住，
       避免出现「黑底黑字」这种比白底更糟的结果。 */
    html[data-theme="dark"] [role="dialog"],
    html[data-theme="dark"] [class*="Modal"],
    html[data-theme="dark"] [class*="modal"]:not([class*="modal-"]),
    html[data-theme="dark"] [class*="MediaLibrary"],
    html[data-theme="dark"] [class*="MediaCard"] {
      background: var(--zt-card) !important;
      color: var(--zt-text) !important;
      border-color: var(--zt-border) !important;
    }
    html[data-theme="dark"] [role="dialog"] *,
    html[data-theme="dark"] [class*="Modal"] * {
      color: var(--zt-text) !important;
      border-color: var(--zt-border) !important;
    }
    html[data-theme="dark"] [role="dialog"] button,
    html[data-theme="dark"] [class*="Modal"] button {
      background: var(--zt-soft) !important;
      color: var(--zt-text) !important;
      border-color: var(--zt-border) !important;
    }
    html[data-theme="dark"] [role="dialog"] button[class*="primary"],
    html[data-theme="dark"] [class*="Modal"] button[class*="primary"],
    html[data-theme="dark"] [role="dialog"] button[data-zt-role="primary-media"],
    html[data-theme="dark"] [class*="Modal"] button[data-zt-role="primary-media"] {
      background: var(--zt-accent) !important;
      color: #0b0b0d !important;
    }
    /* 下拉菜单 / 编辑器 */
    html[data-theme="dark"] [role="menu"],
    html[data-theme="dark"] [class*="Dropdown"],
    html[data-theme="dark"] [class*="MenuList"] {
      background: var(--zt-card) !important;
      color: var(--zt-text) !important;
      border-color: var(--zt-border) !important;
    }
    html[data-theme="dark"] .cm-editor,
    html[data-theme="dark"] .cm-editor .cm-content,
    html[data-theme="dark"] .CodeMirror,
    html[data-theme="dark"] [contenteditable="true"] {
      background: var(--zt-soft) !important;
      color: var(--zt-text) !important;
    }
    html[data-theme="dark"] select,
    html[data-theme="dark"] option {
      background: var(--zt-soft) !important;
      color: var(--zt-text) !important;
    }
    /* 表格分隔线 */
    html[data-theme="dark"] table,
    html[data-theme="dark"] th,
    html[data-theme="dark"] td {
      border-color: var(--zt-border) !important;
      color: var(--zt-text) !important;
    }

    /* ── 字体 / 全局底色 ── */
    html, body {
      font-family: "Inter", ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB", sans-serif !important;
      background: var(--zt-bg) !important;
      color: var(--zt-text) !important;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv11", "ss01";
    }
    /* CMS 顶部 logo 字 */
    a[href="#/"], a[href="/"] {
      font-family: "Inter", sans-serif !important;
      font-weight: 600 !important;
      letter-spacing: -0.01em;
    }

    /* ── 顶栏 ── */
    [class*="AppHeader"],
    header[class*="App"],
    nav[class*="App"] {
      background: rgba(251,251,253,0.78) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--zt-border) !important;
      box-shadow: none !important;
      color: var(--zt-text) !important;
    }

    /* ── 大标题（New Entry / Collections 等） ── */
    h1, h2, h3, h4, h5 {
      color: var(--zt-text) !important;
      letter-spacing: -0.02em !important;
      font-weight: 600 !important;
    }

    /* ── 卡片 / 列表项 ── */
    [class*="Card"],
    [class*="card-"],
    article[class*="nc-"],
    li[class*="Card"] {
      background: var(--zt-card) !important;
      border: 1px solid var(--zt-border) !important;
      border-radius: 14px !important;
      box-shadow: none !important;
    }
    [class*="Card"]:hover,
    article[class*="nc-"]:hover {
      border-color: #d4d4d4 !important;
      box-shadow: 0 6px 24px -10px rgba(0,0,0,0.08) !important;
    }

    /* ── 输入框 / 文本域 ── */
    input[type="text"],
    input[type="url"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    input[type="datetime-local"],
    textarea,
    .CodeMirror {
      background: var(--zt-soft) !important;
      border: 1px solid transparent !important;
      border-radius: 10px !important;
      color: var(--zt-text) !important;
      font-family: inherit !important;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s !important;
    }
    input[type="text"]:focus,
    input[type="url"]:focus,
    input[type="number"]:focus,
    textarea:focus,
    .CodeMirror.CodeMirror-focused {
      background: var(--zt-card) !important;
      border-color: #c7c7cb !important;
      box-shadow: 0 0 0 3px rgba(29,29,31,0.06) !important;
      outline: none !important;
    }

    /* ── 主操作按钮（Publish / Save） ── */
    button[class*="primary"],
    button[type="submit"],
    [data-testid*="publish"],
    [class*="PublishButton"] {
      background: var(--zt-accent) !important;
      color: #fff !important;
      border: 1px solid var(--zt-accent) !important;
      border-radius: 9999px !important;
      padding: 8px 18px !important;
      font-weight: 500 !important;
      box-shadow: none !important;
      transition: opacity 0.15s !important;
    }
    button[class*="primary"]:hover,
    button[type="submit"]:hover {
      opacity: 0.85 !important;
    }

    /* ── 次操作按钮 ── */
    button[class*="secondary"],
    button[class*="default"]:not([class*="primary"]) {
      background: var(--zt-card) !important;
      color: var(--zt-text) !important;
      border: 1px solid var(--zt-border) !important;
      border-radius: 9999px !important;
      box-shadow: none !important;
    }
    button[class*="secondary"]:hover {
      background: var(--zt-soft) !important;
    }

    /* ── 字段 label ── */
    label,
    [class*="ControlContainer"] label,
    [class*="FieldLabel"] {
      font-weight: 500 !important;
      color: var(--zt-text) !important;
      font-size: 13.5px !important;
      letter-spacing: 0 !important;
    }

    /* ── 字段 hint（小灰字） ── */
    [class*="FieldHint"],
    [class*="Hint"],
    p[class*="hint"] {
      color: var(--zt-text-tertiary) !important;
      font-size: 12.5px !important;
      line-height: 1.55 !important;
    }

    /* ── 左侧/顶部导航的 Collection 列表 ── */
    [class*="SidebarNav"] a,
    [class*="CollectionTop"] {
      color: var(--zt-text) !important;
      border-radius: 10px !important;
    }
    [class*="SidebarNav"] a:hover {
      background: var(--zt-soft) !important;
    }

    /* ── Markdown 编辑器工具栏（如果还有用到 markdown 字段） ── */
    [class*="ToolbarContainer"],
    [class*="EditorToolbar"] {
      background: var(--zt-soft) !important;
      border: 1px solid var(--zt-border) !important;
      border-radius: 12px 12px 0 0 !important;
    }
    [class*="ToolbarButton"] {
      color: var(--zt-text-secondary) !important;
    }
    [class*="ToolbarButton"]:hover {
      background: var(--zt-soft-2) !important;
      color: var(--zt-text) !important;
    }

    /* ── 选择 / 下拉 ── */
    [class*="control"],
    select {
      border-radius: 10px !important;
      border-color: var(--zt-border) !important;
    }

    /* ── 文件上传 dropzone ── */
    [class*="DragArea"],
    [class*="Dropzone"] {
      background: var(--zt-soft) !important;
      border: 2px dashed var(--zt-border) !important;
      border-radius: 16px !important;
      color: var(--zt-text-secondary) !important;
    }
    [class*="DragArea"]:hover,
    [class*="Dropzone"]:hover {
      border-color: var(--zt-text-tertiary) !important;
      background: var(--zt-card) !important;
    }

    /* ── 链接强调色 ── */
    a {
      color: var(--zt-text) !important;
      text-underline-offset: 3px;
    }
    a:hover {
      color: #000 !important;
    }

    /* ── Decap 媒体库模态：让"上传"成为视觉焦点 ── */
    /* 上传按钮 = primary，已经被前面 button[type="submit"] 那条规则覆盖。
       这里给主动作加更强的尺寸/间距，让它在一堆按钮里立刻显眼。 */
    button[data-zt-role="primary-media"] {
      background: var(--zt-accent) !important;
      color: #fff !important;
      border-radius: 9999px !important;
      padding: 10px 22px !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12) !important;
    }

    /* ── 浮动"回主站"按钮（沿用站点 Apple-style） ── */
    .back-to-site {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 99999;
      padding: 9px 16px;
      background: var(--zt-text);
      color: #fff;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      font-family: "Inter", sans-serif;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.06);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s, transform 0.15s;
      backdrop-filter: blur(6px);
      /* 只是悬浮小按钮，绝不拦截下面内容的点击（历史 bug：竖条挡死左栏） */
      pointer-events: auto;
      width: fit-content;
      height: auto;
    }
    .back-to-site:hover {
      opacity: 0.85;
      transform: translateY(-1px);
      color: #fff !important;
    }
    .back-to-site svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    /* ── 上传结果提示条 ── */
    .zt-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 100000;
      max-width: 72vw;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--zt-text);
      color: var(--zt-bg);
      font: 500 13px/1.5 "Inter", sans-serif;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      display: none;
    }
    .zt-toast[data-kind="error"] { background: #b42318; color: #fff; }
    .zt-toast[data-kind="ok"] { background: #0b6b3a; color: #fff; }

    /* ── 右下角主题开关 ── */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99999;
      padding: 9px 16px;
      border-radius: 9999px;
      border: 1px solid var(--zt-border);
      background: var(--zt-card);
      color: var(--zt-text);
      font: 500 13px/1 "Inter", sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18), 0 1px 3px rgba(0,0,0,0.06);
      transition: opacity 0.15s, transform 0.15s;
    }
    .theme-toggle:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── ETF 运维入口：叠在「回到主站」上方 ──
       ⚠ 历史 bug：这里原本写的是 `.ops-center { top: 64px }`，但 .back-to-site
       自己带 `bottom: 24px`，fixed 元素同时给了 top 和 bottom 就会被拉成一根
       87×912 的竖条——既是一块挡在左边的大黑框，又覆盖了左栏 87px 的宽度，
       把下面所有点击全部吃掉（上传按钮点不动就是这么来的）。*/
    .back-to-site.ops-center {
      top: auto;
      bottom: 68px;
      left: 24px;
    }
  </style>
  <script>
    // 主题：默认跟随系统；右下角按钮可手动切换，选择存在 localStorage。
    (function () {
      var KEY = "zt-admin-theme";
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function resolve() {
        var saved = null;
        try { saved = localStorage.getItem(KEY); } catch (e) {}
        if (saved === "dark" || saved === "light") return saved;
        return mq.matches ? "dark" : "light";
      }
      function paint() {
        var mode = resolve();
        document.documentElement.dataset.theme = mode;
        var btn = document.getElementById("zt-theme-toggle");
        if (btn) {
          btn.textContent = mode === "dark" ? "☀️ 浅色" : "🌙 深色";
          btn.title = "当前" + (mode === "dark" ? "深色" : "浅色") + "，点一下切换（会记住选择）";
        }
      }
      window.ztToggleTheme = function () {
        try {
          localStorage.setItem(KEY, document.documentElement.dataset.theme === "dark" ? "light" : "dark");
        } catch (e) {}
        paint();
      };
      if (mq.addEventListener) mq.addEventListener("change", paint);
      paint();
      document.addEventListener("DOMContentLoaded", paint);
    })();
  </script>
</head>
<body>
  <!-- 跳回主站 -->
  <a class="back-to-site" href="/" aria-label="返回主站" title="返回主站">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
    <span>回到主站</span>
  </a>

  <!-- 主题开关：默认跟随系统，点一下在深/浅之间切换并记住 -->
  <button id="zt-theme-toggle" class="theme-toggle" type="button"
          onclick="window.ztToggleTheme && window.ztToggleTheme()"
          aria-label="切换深色 / 浅色主题">🌙 深色</button>
  <a class="back-to-site ops-center" href="/admin/etf-ops" aria-label="打开 ETF 运维中心" title="ETF 运维中心">
    <span>ETF 运维</span>
  </a>

  <!-- Decap CMS via CDN -->
  <!-- 版本写死：用 ^3.5.0 时 unpkg 会解析到最新 3.x，Decap 换代可能改
       DOM/class，下面那套样式和上传补丁会静默失效。升级请改这一个数字。 -->
  <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>

  <!-- 后台 UX 补丁：
       1) 把媒体库不必要的按钮（复制/下载/删除）隐掉，让"上传"成为视觉主线
       2) 给 Decap 的 <input type="file"> 加 multiple 属性，并把多文件
          change 事件 拆成 N 次单文件 change 重新分发——绕过 Decap
          handlePersist 里写死的 [...files][0] -->
  <script>
    (function () {
      // ── A. 按钮文字 → 显示/隐藏/标记 主按钮 ─────
      // 媒体库默认要点"选用已选中项目"把文件挂到当前字段。但我们的相册
      // 是靠扫文件夹生成 manifest 的，frontmatter 里写不写文件路径都不影响
      // 渲染——所以这一步对用户来说是多余的，隐了。
      // ⚠ 不要隐「选用已选中项目 / Insert selected」：封面字段要用它确认选图。
      // 相册批量上传那条路径靠上传后自动发 Esc 关模态，不依赖这个按钮。
      const HIDE_TEXTS = new Set([
        '复制', '下载', '删除已选中项目',
        'Copy', 'Download', 'Delete selected',
      ]);
      const PRIMARY_TEXTS = new Set(['上传', 'Upload']);

      function trim(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

      function refineButtons(root) {
        root.querySelectorAll('button, [role="button"]').forEach((el) => {
          if (el.dataset.ztProcessed) return;
          const text = trim(el.textContent);
          if (HIDE_TEXTS.has(text)) {
            el.style.display = 'none';
            el.setAttribute('aria-hidden', 'true');
          } else if (PRIMARY_TEXTS.has(text)) {
            el.dataset.ztRole = 'primary-media';
          }
          el.dataset.ztProcessed = '1';
        });
      }

      // ── B. 批量上传：自己组一次 commit 推到 main ─────
      // 为什么不再借 Decap 的上传：
      //   1) 3.17.3 的 media library 一次只 persist 一个文件（handlePersist
      //      里写死 [...files][0]），多选直接丢；
      //   2) 老补丁靠"把一个 change 事件拆成 N 个合成 change"去骗 React，
      //      Decap 升级后合成事件不再触发它的 handler——实测 0 个写请求，
      //      用户看到的现象就是"选了图、什么都没发生"；
      //   3) 相册本来就靠扫文件夹生成 manifest，frontmatter 里记不记路径都
      //      不影响渲染，所以根本不必走它的媒体库。
      // 现在直接调 GitHub API，一次 commit 提交所有图；CI 收到后重建 manifest，
      // 连「发布」都不用点。
      const REPO = 'lzf00/zorotreeking';
      const BRANCH = 'main';

      function readUserToken() {
        try {
          const raw = localStorage.getItem('decap-cms-user');
          const user = raw ? JSON.parse(raw) : null;
          return user && typeof user.token === 'string' ? user.token : null;
        } catch (_) {
          return null;
        }
      }

      function fieldValue(labelPrefix) {
        const boxes = document.querySelectorAll('[class*="ControlContainer"]');
        for (const box of boxes) {
          const label = box.querySelector('label');
          if (!label) continue;
          if (!(label.textContent || '').trim().startsWith(labelPrefix)) continue;
          const input = box.querySelector('input[type="text"], input:not([type])');
          if (input && input.value.trim()) return input.value.trim();
        }
        return '';
      }

      function albumKey() {
        const fromField = fieldValue('相册编号');
        if (fromField) return fromField;
        const m = location.hash.match(/entries\/([^/?#]+)/);
        return m ? decodeURIComponent(m[1]) : '';
      }

      async function gh(pathname, options) {
        const token = readUserToken();
        const res = await fetch('https://api.github.com' + pathname, {
          ...options,
          headers: {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            ...(options && options.headers ? options.headers : {}),
          },
        });
        if (!res.ok) {
          let detail = '';
          try {
            const body = await res.json();
            detail = body && body.message ? body.message : '';
          } catch (_) {}
          throw new Error(String(res.status) + (detail ? ' ' + detail : ''));
        }
        return res.json();
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      async function commitPhotos(files, folder) {
        const ref = await gh('/repos/' + REPO + '/git/ref/heads/' + BRANCH);
        const baseSha = ref.object.sha;
        const base = await gh('/repos/' + REPO + '/git/commits/' + baseSha);
        const entries = [];
        for (const file of files) {
          const content = await fileToBase64(file);
          const blob = await gh('/repos/' + REPO + '/git/blobs', {
            method: 'POST',
            body: JSON.stringify({ content: content, encoding: 'base64' }),
          });
          entries.push({ path: folder + '/' + file.name, mode: '100644', type: 'blob', sha: blob.sha });
        }
        const tree = await gh('/repos/' + REPO + '/git/trees', {
          method: 'POST',
          body: JSON.stringify({ base_tree: base.tree.sha, tree: entries }),
        });
        const commit = await gh('/repos/' + REPO + '/git/commits', {
          method: 'POST',
          body: JSON.stringify({
            message: 'content(photo): 上传 ' + files.length + ' 张照片到 ' + folder,
            tree: tree.sha,
            parents: [baseSha],
          }),
        });
        await gh('/repos/' + REPO + '/git/refs/heads/' + BRANCH, {
          method: 'PATCH',
          body: JSON.stringify({ sha: commit.sha }),
        });
      }

      function toast(message, kind) {
        let el = document.getElementById('zt-toast');
        if (!el) {
          el = document.createElement('div');
          el.id = 'zt-toast';
          el.className = 'zt-toast';
          document.body.appendChild(el);
        }
        el.textContent = message;
        el.dataset.kind = kind || 'info';
        el.style.display = 'block';
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => { el.style.display = 'none'; }, kind === 'error' ? 15000 : 7000);
      }

      async function handleFiles(input) {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        const folder = albumKey();
        if (!folder) {
          toast('先填「相册编号」再上传——它决定图片落到哪个文件夹', 'error');
          return;
        }
        const dir = 'public/photos/uploads/' + folder;
        toast('正在上传 ' + files.length + ' 张到 ' + dir + ' …');
        try {
          await commitPhotos(files, dir);
          toast('已上传 ' + files.length + ' 张到 ' + dir + '。部署约 1~2 分钟后自动重建相册，不用点「发布」。', 'ok');
          try {
            document.dispatchEvent(
              new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true })
            );
          } catch (_) {}
        } catch (err) {
          toast('上传失败：' + (err && err.message ? err.message : err), 'error');
          console.error('[zt] photo upload failed', err);
        }
        input.value = '';
      }

      // 拦下文件选择：不管 1 张还是 50 张，都走上面的直传逻辑，
      // 不再依赖 Decap 的 change handler（它已经接不住了）。
      function shimInput(input) {
        if (input.dataset.ztShimmed) return;
        input.dataset.ztShimmed = '1';
        input.setAttribute('multiple', 'multiple');
        input.addEventListener(
          'change',
          (e) => {
            if (input.__ztSynthetic) return;
            const files = Array.from(input.files || []);
            if (!files.length) return;
            // 没登录（拿不到 token）就把事件放回给原生逻辑，别把上传吞掉
            if (!readUserToken()) return;
            e.stopImmediatePropagation();
            e.preventDefault();
            handleFiles(input);
          },
          true
        );
        console.log('[zt] upload input hooked →', input);
      }

      function scan(root) {
        // file widget / 媒体库共用同一个 className
        root.querySelectorAll('label.nc-fileUploadButton input[type="file"]')
          .forEach(shimInput);
        // 兜底：所有未处理的 file input 也补一遍
        root.querySelectorAll('input[type="file"]:not([data-zt-shimmed])')
          .forEach(shimInput);
        refineButtons(root);
      }

      // 首屏 + 动态挂载都跑
      const start = () => {
        scan(document.documentElement);
        const obs = new MutationObserver(() => scan(document.documentElement));
        obs.observe(document.documentElement, { childList: true, subtree: true });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
