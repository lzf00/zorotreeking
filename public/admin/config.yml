# Decap CMS 配置（GitHub 后端 + Cloudflare Worker OAuth 代理）
#
# 字段约定（四个 collection 共用顺序，让认知一致）：
#   1) 标题
#   2) 编号 / URL（必填，技术性但用户须知）
#   3) 时间
#   4) 描述 / 正文 / 域专属字段
#   5) 标签 / 分类（可选）
#   6) 🌐 语言 / 草稿（默认值合理，常态不动）

backend:
  name: github
  repo: lzf00/zorotreeking
  branch: main
  base_url: https://decap-oauth.zoro1024111.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Create {{collection}} '{{slug}}'"
    update: "Update {{collection}} '{{slug}}'"
    delete: "Delete {{collection}} '{{slug}}'"
    uploadMedia: "Upload media '{{path}}'"
    deleteMedia: "Delete media '{{path}}'"

locale: zh_Hans
site_url: https://www.zorotreeking.online
display_url: https://www.zorotreeking.online
logo_url: /favicon.svg

# 全局默认 media 目录（被 photo collection 自定义覆盖到 /uploads/{slug}）
media_folder: public/photos/uploads
public_folder: /photos/uploads

publish_mode: simple

# 中英文合成「一个条目 + 语言标签」：
#   文件名仍然是 <相册编号>.zh.mdx / <相册编号>.en.mdx，Decap 靠后缀区分；
#   编辑时在右上角切 中文 / English，不用再新建第二条。
# ⚠ 切到英文标签时，把「🌐 语言」字段也改成 English（frontmatter 的 lang 靠它）。
#   忘了改不会构建失败，但会静默多出一条中文——build 里已加
#   scripts/check-content-lang.ts 拦截这种情况。
i18n:
  structure: multiple_files
  locales: [zh, en]
  default_locale: zh

collections:

  # ────────────────────────────────────────
  # AI 学习
  # ────────────────────────────────────────
  - name: ai
    label: "AI 学习"
    label_singular: "AI 文章"
    folder: src/content/ai
    # 文章配图走自己的目录，别和相册图混在一起
    media_folder: "/public/uploads"
    public_folder: "/uploads"
    create: true
    i18n: true
    slug: "{{fields.translationKey}}"
    extension: mdx
    format: frontmatter
    summary: "[{{lang}}] {{title}} · {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "仅中文", field: lang, pattern: "zh" }
      - { label: "仅英文", field: lang, pattern: "en" }
      - { label: "草稿", field: draft, pattern: true }
    fields:
      - { label: 标题, name: title, widget: string, i18n: true }
      - { label: 文章编号, name: translationKey, widget: string, hint: "中英文用同一个，例：rag-deep-dive", i18n: true }
      - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: false, i18n: true }
      - { label: 一句话描述, name: description, widget: text, required: false, hint: 用于列表 + SEO，可留空, i18n: true }
      - { label: 分类, name: category, widget: select, options: [basics, paper, tool, applied, thoughts], default: thoughts, i18n: true }
      - { label: 标签, name: tags, widget: list, default: [], required: false, i18n: true }
      - label: 封面图
        name: cover
        widget: image
        i18n: true
        required: false
        choose_url: false
        hint: 点开从「媒体库」选图（会传到 /uploads/）。留空则用站内自动生成的 OG 图。
      - { label: 正文, name: body, widget: markdown, i18n: true }
      - { label: 更新日期, name: updated, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: false, i18n: true }
      - { label: "🌐 语言", name: lang, widget: select, options: [{label: "中文", value: zh}, {label: "English", value: en}], default: zh, hint: "必须和右上角选的标签一致：英文标签 → English。写错的会被 build 拦下。", i18n: true }
      - { label: 草稿, name: draft, widget: boolean, default: false, i18n: true }

  # ────────────────────────────────────────
  # 个人投资
  # ────────────────────────────────────────
  - name: invest
    label: "个人投资"
    label_singular: "投资文章"
    folder: src/content/invest
    media_folder: "/public/uploads"
    public_folder: "/uploads"
    create: true
    i18n: true
    slug: "{{fields.translationKey}}"
    extension: mdx
    format: frontmatter
    summary: "[{{lang}}] {{title}} · {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "仅中文", field: lang, pattern: "zh" }
      - { label: "仅英文", field: lang, pattern: "en" }
      - { label: "草稿", field: draft, pattern: true }
    fields:
      - { label: 标题, name: title, widget: string, i18n: true }
      - { label: 文章编号, name: translationKey, widget: string, hint: "中英文用同一个，例：2026-05-review", i18n: true }
      - { label: 发布日期, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: false, i18n: true }
      - { label: 一句话描述, name: description, widget: text, required: false, i18n: true }
      - label: 封面图
        name: cover
        widget: image
        i18n: true
        required: false
        choose_url: false
        hint: 点开从「媒体库」选图（会传到 /uploads/）。留空则用站内自动生成的 OG 图。
      - { label: 标签, name: tags, widget: list, default: [], required: false, i18n: true }
      - { label: "关联期间（如 2026-05）", name: period, widget: string, required: false, i18n: true }
      - { label: "关联快照 YAML（不含扩展名）", name: portfolio, widget: string, required: false, i18n: true }
      - { label: 正文, name: body, widget: markdown, i18n: true }
      - { label: "🌐 语言", name: lang, widget: select, options: [{label: "中文", value: zh}, {label: "English", value: en}], default: zh, hint: "必须和右上角选的标签一致：英文标签 → English。写错的会被 build 拦下。", i18n: true }
      - { label: 草稿, name: draft, widget: boolean, default: false, i18n: true }

  # ────────────────────────────────────────
  # 摄影相册 —— 极简：图片为主，文字为辅
  # 字段最少化；保存后到媒体库拖图，部署期自动扫 EXIF 出 manifest
  # ────────────────────────────────────────
  - name: photo
    label: "摄影相册"
    label_singular: "相册"
    folder: src/content/photo
    create: true
    i18n: true
    slug: "{{fields.translationKey}}"
    extension: mdx
    format: frontmatter
    summary: "[{{lang}}] {{title}} · {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    # 上传的图片落到 public/photos/uploads/<相册编号>/，部署期由
    # scripts/build-photo-manifests.ts 扫一遍自动生成 manifest（EXIF + 尺寸）
    media_folder: "/public/photos/uploads/{{fields.translationKey}}"
    public_folder: "/photos/uploads/{{fields.translationKey}}"
    fields:
      - label: 标题
        name: title
        widget: string
        i18n: true
        hint: 显示在相册顶部的大字，例「初夏 · 上海」
      - label: 相册编号
        name: translationKey
        widget: string
        i18n: true
        pattern: ['^[a-z0-9][a-z0-9-]*$', '只能用小写字母 / 数字 / 短横线']
        hint: "URL 和图片文件夹名。⚠ 先填这一项再上传，例：2026-summer-shanghai"
      - label: 拍摄日期
        name: date
        widget: datetime
        i18n: true
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: 拍摄地
        name: location
        widget: string
        i18n: true
        required: false
      - label: 简介
        name: description
        widget: text
        i18n: true
        required: false
        hint: 可写一段拍摄背景或心得（显示在大图区之上）。留空也无妨——图片才是重点。
      - label: 上传照片（只负责上传，不参与排序）
        name: photos
        widget: file
        i18n: true
        required: false
        allow_multiple: true
        choose_url: false
        media_library:
          config:
            multiple: true
        hint: |
          ① 单击方框 → 系统文件框，按 ⌘ / Shift 多选；
          ② 也可直接把一组图拖进方框。
          文件落到「相册编号」对应的文件夹，部署期自动抽 EXIF + 尺寸生成相册。
          ⚠ 传完别再改「相册编号」——图片已经在旧文件夹里了，改编号等于换目录。
          排序/封面不看这个字段：封面用上面的「封面」，其余按文件名排序。
      - label: 封面
        name: cover
        widget: image
        i18n: true
        required: false
        choose_url: false
        hint: |
          列表页和相册顶部的那张大图。点开 →「媒体库」→ 选本相册里任意一张即可。
          留空 = 自动用文件名排序第一张（想换封面又不想点选，就把它重命名成 00 开头）。
      - label: "🌐 语言"
        name: lang
        widget: select
        i18n: true
        options: [{label: "中文", value: zh}, {label: "English", value: en}]
        default: zh
        hint: "必须和右上角选的标签一致：英文标签 → English。写错的会被 build 拦下。"
      - label: 草稿
        name: draft
        widget: boolean
        i18n: true
        default: false
    view_filters:
      - { label: "仅中文", field: lang, pattern: "zh" }
      - { label: "仅英文", field: lang, pattern: "en" }
      - { label: "草稿", field: draft, pattern: true }

  # ────────────────────────────────────────
  # 徒步路线
  # ────────────────────────────────────────
  - name: hike
    label: "徒步路线"
    label_singular: "路线"
    folder: src/content/hike
    create: true
    i18n: true
    slug: "{{fields.translationKey}}"
    extension: mdx
    format: frontmatter
    summary: "[{{lang}}] {{title}} · {{date | date('YYYY-MM-DD')}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "仅中文", field: lang, pattern: "zh" }
      - { label: "仅英文", field: lang, pattern: "en" }
      - { label: "草稿", field: draft, pattern: true }
    fields:
      - { label: 标题, name: title, widget: string, i18n: true }
      - { label: 路线编号, name: translationKey, widget: string, hint: "中英文用同一个，例：lingshan-traverse", i18n: true }
      - { label: 出行日期, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: false, i18n: true }
      - { label: 地点, name: location, widget: string, i18n: true }
      - { label: 一句话描述, name: description, widget: text, required: false, i18n: true }
      - { label: 距离 km, name: distanceKm, widget: number, required: false, value_type: float, i18n: true }
      - { label: 累计爬升 m, name: elevationGainM, widget: number, required: false, value_type: int, i18n: true }
      - { label: 用时（小时）, name: durationHours, widget: number, required: false, value_type: float, i18n: true }
      - { label: 难度, name: difficulty, widget: select, options: [easy, moderate, hard, expert], default: moderate, i18n: true }
      - { label: 标签, name: tags, widget: list, default: [], required: false, i18n: true }
      - { label: "GPX 文件名（放在 public/gpx 下，仅文件名）", name: gpx, widget: string, required: false, i18n: true }
      - { label: 关联相册编号, name: photoAlbum, widget: string, required: false, i18n: true }
      - { label: 游记正文, name: body, widget: markdown, i18n: true }
      - { label: "🌐 语言", name: lang, widget: select, options: [{label: "中文", value: zh}, {label: "English", value: en}], default: zh, hint: "必须和右上角选的标签一致：英文标签 → English。写错的会被 build 拦下。", i18n: true }
      - { label: 草稿, name: draft, widget: boolean, default: false, i18n: true }
